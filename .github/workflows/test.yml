name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Bundle is up to date
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "dist/ is stale: run 'npm run build' and commit the result." && exit 1)

  # Publishes src/ to GitHub Pages after the tests pass on main.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the offline cache with this commit
        run: |
          sed -i "s/const CACHE = \"kaku-dev\";/const CACHE = \"kaku-${GITHUB_SHA::12}\";/" src/sw.js
          grep -q "kaku-${GITHUB_SHA::12}" src/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4

  # Builds the Android app. On pull requests it only checks that the APK builds;
  # on main it publishes the APK as a GitHub Release ("Latest").
  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Copy the web app into the Android project
        run: npx cap sync android
      - name: Version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "file=kaku-$v-build$GITHUB_RUN_NUMBER.apk" >> "$GITHUB_OUTPUT"
      - name: Signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/kaku-release.jks"
      - name: Build
        working-directory: android
        env:
          KAKU_VERSION_CODE: ${{ github.run_number }}
          KAKU_VERSION_NAME: ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          KAKU_KEYSTORE_PATH: ${{ env.HAS_KEY == 'true' && format('{0}/kaku-release.jks', runner.temp) || '' }}
          KAKU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KAKU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KAKU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEY" = true ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../${{ steps.version.outputs.file }}"
          else
            echo "::warning::No signing key in repo secrets, building a debug APK. Run tools/make-release-key.sh to set one up."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../${{ steps.version.outputs.file }}"
          fi
      - name: Check the APK
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "${{ steps.version.outputs.file }}" | head -3
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$aapt" dump badging "${{ steps.version.outputs.file }}" | grep -E "^package:|application-label:"
          unzip -l "${{ steps.version.outputs.file }}" | grep -q "assets/public/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.file }}
          path: ${{ steps.version.outputs.file }}
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}-build.${GITHUB_RUN_NUMBER}"
          if [ "$HAS_KEY" = true ]; then
            signing="Signed with the Kaku release key, so it installs over earlier release-signed builds and keeps your progress."
          else
            signing="**Debug-signed** (no release key set up yet): uninstall any earlier build before installing this one."
          fi
          gh release create "$tag" "${{ steps.version.outputs.file }}" \
            --target "$GITHUB_SHA" --latest \
            --title "Kaku ${{ steps.version.outputs.name }} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Android app built from ${GITHUB_SHA::7}. Download the APK below on your phone and open it to install (allow installs from your browser when Android asks). ${signing}"
