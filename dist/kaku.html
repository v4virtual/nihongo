/* js/geometry.js */
/* Stroke geometry: parses KanjiVG paths, resamples polylines and grades a
 * handwritten stroke against the reference. All coordinates live in KanjiVG's
 * 109×109 box. Pure functions, so tools/test-geometry.mjs can run them in Node. */
window.NH = window.NH || {};

(function () {
  const BOX = 109;
  const N = 48; // points per resampled stroke

  // Flattens an SVG path (M/L/C/S/Q/Z, absolute or relative) into a polyline.
  function flatten(d) {
    const toks = d.match(/[a-zA-Z]|-?(?:\d*\.\d+|\d+\.?)(?:e[-+]?\d+)?/g) || [];
    const pts = [];
    let i = 0, cmd = "", x = 0, y = 0, sx = 0, sy = 0, cx2 = 0, cy2 = 0, prev = "";
    const num = () => parseFloat(toks[i++]);
    const cubic = (x1, y1, x2, y2, x3, y3) => {
      const x0 = x, y0 = y;
      for (let k = 1; k <= 16; k++) {
        const t = k / 16, u = 1 - t;
        pts.push({
          x: u * u * u * x0 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3,
          y: u * u * u * y0 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3,
        });
      }
      cx2 = x2; cy2 = y2; x = x3; y = y3;
    };
    while (i < toks.length) {
      if (/[a-zA-Z]/.test(toks[i])) cmd = toks[i++];
      const rel = cmd === cmd.toLowerCase();
      const ox = rel ? x : 0, oy = rel ? y : 0;
      switch (cmd.toUpperCase()) {
        case "M":
          x = num() + ox; y = num() + oy; sx = x; sy = y;
          pts.push({ x, y });
          cmd = rel ? "l" : "L"; // implicit lineto after moveto
          break;
        case "L":
          x = num() + ox; y = num() + oy; pts.push({ x, y });
          break;
        case "H":
          x = num() + ox; pts.push({ x, y });
          break;
        case "V":
          y = num() + oy; pts.push({ x, y });
          break;
        case "C": {
          const a = [num() + ox, num() + oy, num() + ox, num() + oy, num() + ox, num() + oy];
          cubic(...a);
          break;
        }
        case "S": {
          const rx = /[CS]/i.test(prev) ? 2 * x - cx2 : x;
          const ry = /[CS]/i.test(prev) ? 2 * y - cy2 : y;
          const a = [num() + ox, num() + oy, num() + ox, num() + oy];
          cubic(rx, ry, ...a);
          break;
        }
        case "Q": {
          const qx = num() + ox, qy = num() + oy, ex = num() + ox, ey = num() + oy;
          cubic(x + (2 / 3) * (qx - x), y + (2 / 3) * (qy - y), ex + (2 / 3) * (qx - ex), ey + (2 / 3) * (qy - ey), ex, ey);
          break;
        }
        case "Z":
          x = sx; y = sy; pts.push({ x, y });
          break;
        default:
          i++; // unsupported command: skip a token rather than loop forever
      }
      prev = cmd;
    }
    return pts;
  }

  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function length(pts) {
    let L = 0;
    for (let i = 1; i < pts.length; i++) L += dist(pts[i - 1], pts[i]);
    return L;
  }

  // Resamples a polyline to n points evenly spaced along its length.
  function resample(pts, n = N) {
    if (!pts.length) return [];
    const L = length(pts);
    if (L < 1e-6) return Array.from({ length: n }, () => ({ x: pts[0].x, y: pts[0].y }));
    const step = L / (n - 1);
    const out = [{ x: pts[0].x, y: pts[0].y }];
    let acc = 0;
    for (let i = 1; i < pts.length && out.length < n; i++) {
      let a = pts[i - 1];
      const b = pts[i];
      let seg = dist(a, b);
      while (acc + seg >= step && out.length < n) {
        const t = (step - acc) / seg;
        const p = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
        out.push(p);
        a = p;
        seg = dist(a, b);
        acc = 0;
      }
      acc += seg;
    }
    while (out.length < n) out.push({ ...pts[pts.length - 1] });
    return out;
  }

  const cache = new Map();
  // Reference strokes for a character: [{ d, pts (resampled), len }]
  function strokesOf(ch) {
    if (cache.has(ch)) return cache.get(ch);
    const paths = (NH.STROKES && NH.STROKES[ch]) || [];
    const strokes = paths.map((d) => {
      const raw = flatten(d);
      const len = length(raw);
      // A hane is a short upward flick at the end of a long stroke (い, け, は, り…).
      return { d, raw, pts: resample(raw), len, hane: len >= 40 && endTurn(raw, 55) };
    });
    cache.set(ch, strokes);
    return strokes;
  }

  // Point at arc length s back from the end of a polyline.
  function fromEnd(pts, s) {
    let acc = 0;
    for (let i = pts.length - 1; i > 0; i--) {
      const d = dist(pts[i], pts[i - 1]);
      if (acc + d >= s) {
        const t = (s - acc) / d;
        return { x: pts[i].x + (pts[i - 1].x - pts[i].x) * t, y: pts[i].y + (pts[i - 1].y - pts[i].y) * t };
      }
      acc += d;
    }
    return pts[0];
  }

  /* True when the stroke ends with an upward flick: over its last few units the
   * direction turns by more than `minDeg` from the body just before it. */
  function endTurn(pts, minDeg, tails = [3, 4, 5, 6, 7, 8, 9]) {
    const L = length(pts);
    const end = pts[pts.length - 1];
    for (const t of tails) {
      if (L < t * 3) continue;
      const a = fromEnd(pts, t), b = fromEnd(pts, t + 10);
      let d = Math.abs(Math.atan2(end.y - a.y, end.x - a.x) - Math.atan2(a.y - b.y, a.x - b.x));
      if (d > Math.PI) d = 2 * Math.PI - d;
      if ((d * 180) / Math.PI > minDeg && end.y - a.y < -0.5) return true;
    }
    return false;
  }

  // Did the learner finish with a flick? Handwriting hooks are short and soft,
  // so this looks at shorter tails and accepts a gentler turn than the model.
  const hasHook = (userPts) => endTurn(smooth(userPts), 35, [2, 3, 4, 5, 6, 7, 8, 9]);

  // Tolerances in KanjiVG units (the box is 109 wide) per assist level.
  const TOL = { trace: 16, guide: 12.5, memory: 10.5 };

  // Moving-average smoothing that keeps the end points, to tame pointer jitter.
  function smooth(pts, r = 2) {
    if (pts.length < 5) return pts;
    return pts.map((p, i) => {
      if (i === 0 || i === pts.length - 1) return p;
      let sx = 0, sy = 0, n = 0;
      for (let k = Math.max(0, i - r); k <= Math.min(pts.length - 1, i + r); k++) { sx += pts[k].x; sy += pts[k].y; n++; }
      return { x: sx / n, y: sy / n };
    });
  }

  function meanDist(a, b, reversed) {
    let s = 0;
    for (let i = 0; i < a.length; i++) s += dist(a[i], b[reversed ? b.length - 1 - i : i]);
    return s / a.length;
  }

  /* Grades one user stroke (points in box units) against reference stroke `ref`.
   * Returns { ok, accuracy 0-100, avg, reversed } */
  function grade(userPts, ref, assist = "guide") {
    const short = ref.len < 22;
    const T = (TOL[assist] || TOL.guide) * (short ? 1.4 : 1);
    const U = resample(smooth(userPts));
    const avg = meanDist(U, ref.pts, false);
    const rev = meanDist(U, ref.pts, true);
    const ratio = length(U) / Math.max(ref.len, 1);
    const [lo, hi] = short ? [0.15, 4] : [0.4, 2.6];
    const reversed = !short && rev <= T && rev < avg * 0.6;
    const ok = !reversed && avg <= T && ratio >= lo && ratio <= hi;
    const accuracy = Math.round(100 * Math.max(0, 1 - Math.pow(avg / (2.5 * T), 1.3)));
    return { ok, accuracy, avg, reversed, ratio };
  }

  /* Judges a user stroke when stroke `expected` is due. Returns
   *   { status: "ok" | "order" | "reversed" | "miss", grade, actual }
   * "order" means it matches a different unwritten stroke clearly better. */
  function judge(userPts, strokes, expected, done, assist) {
    const g = grade(userPts, strokes[expected], assist);
    let actual = -1, bestAvg = Infinity;
    strokes.forEach((ref, i) => {
      if (i === expected || done.has(i)) return;
      const o = grade(userPts, ref, assist);
      if (o.ok && o.avg < bestAvg) { actual = i; bestAvg = o.avg; }
    });
    if (g.ok && !(actual >= 0 && bestAvg < g.avg * 0.5)) return { status: "ok", grade: g, actual: expected };
    if (actual >= 0) return { status: "order", grade: g, actual };
    if (g.reversed) return { status: "reversed", grade: g, actual: expected };
    return { status: "miss", grade: g, actual: -1 };
  }

  // Where to put a stroke's number: a little behind its starting point.
  function labelPos(ref) {
    const p0 = ref.pts[0], p1 = ref.pts[Math.min(4, ref.pts.length - 1)];
    let dx = p1.x - p0.x, dy = p1.y - p0.y;
    const L = Math.hypot(dx, dy) || 1;
    dx /= L; dy /= L;
    // step back along the stroke and a bit to its left
    return { x: NH.clamp(p0.x - dx * 6 - dy * 5, 5, BOX - 5), y: NH.clamp(p0.y - dy * 6 + dx * 5, 6, BOX - 3) };
  }

  // ── plain-language stroke descriptions (for screen readers) ─────────────
  const DIRS = ["right", "down-right", "down", "down-left", "left", "up-left", "up", "up-right"];
  const dirOf = (a, b) => DIRS[(Math.round(Math.atan2(b.y - a.y, b.x - a.x) / (Math.PI / 4)) + 8) % 8];
  const third = (v) => (v < BOX / 3 ? 0 : v < (2 * BOX) / 3 ? 1 : 2);
  function place(p) {
    const row = ["top", "middle", "bottom"][third(p.y)], col = ["left", "centre", "right"][third(p.x)];
    return row === "middle" && col === "centre" ? "the centre" : row === "middle" ? `the middle ${col}` : `the ${row} ${col}`;
  }
  // Total turning along the stroke, in degrees (sign ignored).
  function turning(pts) {
    let t = 0;
    for (let i = 2; i < pts.length; i++) {
      let d = Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x) - Math.atan2(pts[i - 1].y - pts[i - 2].y, pts[i - 1].x - pts[i - 2].x);
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      t += Math.abs(d);
    }
    return (t * 180) / Math.PI;
  }

  /* e.g. "starts at the top left, a line going right" or
   * "starts at the top centre, curves down then left, and ends with a flick". */
  function describe(st) {
    const p = resample(st.raw, 24);
    const a = p[0], z = p[p.length - 1], mid = p[12];
    const straight = dist(a, z) / Math.max(st.len, 1);
    let shape;
    if (st.len < 22) shape = `a short mark going ${dirOf(a, z)}`;
    else if (turning(p) > 300) shape = `goes ${dirOf(a, mid)} and loops around`;
    else if (straight > 0.92) shape = `a ${st.len > 60 ? "long " : ""}line going ${dirOf(a, z)}`;
    else {
      const d1 = dirOf(a, mid), d2 = dirOf(mid, z);
      shape = d1 === d2 ? `a curve going ${d1}` : `curves ${d1}, then ${d2}`;
    }
    return `starts at ${place(a)}, ${shape}${st.hane ? ", and ends with a flick (hane)" : ""}`;
  }

  NH.Geo = { BOX, N, flatten, resample, smooth, length, dist, strokesOf, grade, judge, labelPos, hasHook, describe, TOL };
})();

/* js/ink.js */
/* Ink renderers for the three writing styles. Each takes a 2D context and a
 * stroke as pixel points [{x, y, t, p}] and paints it:
 *   pencil – graphite on notebook paper
 *   brush  – sumi ink whose width follows speed and pressure, with dry-brush
 *            streaks (kasure) on fast sweeps and tapered flicks (harai)
 *   neon   – glowing glass tube; `tube` paints the same tube unlit */
window.NH = window.NH || {};

(function () {
  const { dist } = { dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y) };

  function chaikin(pts, iters = 2) {
    let p = pts;
    for (let k = 0; k < iters && p.length > 2; k++) {
      const q = [p[0]];
      for (let i = 0; i < p.length - 1; i++) {
        const a = p[i], b = p[i + 1];
        q.push(mix(a, b, 0.25));
        q.push(mix(a, b, 0.75));
      }
      q.push(p[p.length - 1]);
      p = q;
    }
    return p;
  }

  // Interpolates position, time and pressure, so speeds stay meaningful after smoothing.
  const mix = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, t: a.t + (b.t - a.t) * t, p: a.p + (b.p - a.p) * t });

  function path(ctx, pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 1) { ctx.lineTo(pts[0].x + 0.01, pts[0].y); return; }
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const l = pts[pts.length - 1];
    ctx.lineTo(l.x, l.y);
  }

  // Seeded random so a stroke's texture is identical on every redraw.
  function prng(seed) {
    let s = (Math.abs(Math.floor(seed * 9973)) % 2147483646) + 1;
    return () => ((s = (s * 16807) % 2147483647) / 2147483647);
  }

  // ── pencil ───────────────────────────────────────────────
  let graphite = null;
  function graphitePattern(ctx) {
    if (graphite) return graphite;
    const c = document.createElement("canvas");
    c.width = c.height = 96;
    const g = c.getContext("2d");
    g.fillStyle = "#3a3a44";
    g.fillRect(0, 0, 96, 96);
    const img = g.getImageData(0, 0, 96, 96);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = Math.random();
      const v = n < 0.18 ? 120 : n < 0.3 ? 85 : 58;
      img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v + 8;
      img.data[i + 3] = n < 0.12 ? 120 : 235;
    }
    g.putImageData(img, 0, 0);
    graphite = ctx.createPattern(c, "repeat");
    return graphite;
  }

  function pencil(ctx, pts, { w, color }) {
    if (!pts.length) return;
    const sm = chaikin(pts, 2);
    const pr = pressureOf(pts);
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = color || "#444";
    ctx.lineWidth = w * 0.5 * pr;
    path(ctx, sm);
    ctx.stroke();
    ctx.globalAlpha = 0.95;
    ctx.strokeStyle = color || graphitePattern(ctx);
    ctx.lineWidth = w * 0.3 * pr;
    path(ctx, sm);
    ctx.stroke();
    ctx.restore();
  }

  function pressureOf(pts) {
    // Real pen pressure varies; mice report a flat 0.5 or 0, which we ignore.
    const ps = pts.map((p) => p.p).filter((p) => p > 0 && p !== 0.5);
    if (ps.length < pts.length / 2) return 1;
    return 0.55 + 0.8 * (ps.reduce((a, b) => a + b, 0) / ps.length);
  }

  // ── brush ────────────────────────────────────────────────
  let off = null;
  function offscreen(w, h) {
    if (!off) off = document.createElement("canvas");
    if (off.width !== w || off.height !== h) { off.width = w; off.height = h; }
    const c = off.getContext("2d");
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, w, h);
    return c;
  }

  /* Widths per point: slow = loaded, wide brush; fast = thin. The entry
   * presses in (irikomi); a fast exit tapers into a sweep (harai), a slow one
   * stops blunt (tome). `scale` normalises speed to the cell size. */
  function brushWidths(pts, w, scale, live) {
    const n = pts.length;
    const sp = new Array(n).fill(0);
    for (let i = 1; i < n; i++) {
      const dt = Math.max(4, pts[i].t - pts[i - 1].t);
      sp[i] = (dist(pts[i], pts[i - 1]) / dt) * scale;
    }
    sp[0] = sp[1] || 0;
    for (let i = 1; i < n; i++) sp[i] = sp[i - 1] * 0.7 + sp[i] * 0.3;
    const pr = pressureOf(pts);
    const ws = sp.map((v) => w * NH.clamp(1.4 - 1.25 * v, 0.3, 1.35) * pr);
    // entry
    let acc = 0;
    for (let i = 0; i < n; i++) {
      if (i) acc += dist(pts[i], pts[i - 1]);
      const t = acc / (w * 0.9);
      if (t >= 1) break;
      ws[i] *= 0.55 + 0.5 * Math.sin(t * Math.PI * 0.6);
    }
    // exit
    const endSpeed = sp.slice(-5).reduce((a, b) => a + b, 0) / Math.min(5, n);
    if (!live && endSpeed > 0.75) {
      const total = acc + pts.slice(1).reduce((a, p, i) => a + dist(p, pts[i]), 0) - acc;
      let back = 0;
      const tail = Math.min(total * 0.45, w * 4.5);
      for (let i = n - 1; i > 0 && back < tail; i--) {
        ws[i] *= Math.pow(back / tail, 0.7) * 0.95 + 0.04;
        back += dist(pts[i], pts[i - 1]);
      }
    }
    return { ws, sp };
  }

  function brush(ctx, pts, { w, color = "#16120f", scale = 1, live = false, bleed = true }) {
    if (!pts.length) return;
    const sm = chaikin(pts, 2);
    const { ws, sp } = brushWidths(sm, w, scale, live);
    const cw = ctx.canvas.width, ch = ctx.canvas.height;
    const o = offscreen(cw, ch);
    o.setTransform(ctx.getTransform());
    o.fillStyle = color;
    // Body: discs joined by quads along the centreline.
    for (let i = 0; i < sm.length; i++) {
      const p = sm[i], r = ws[i] / 2;
      o.beginPath();
      o.arc(p.x, p.y, Math.max(0.3, r), 0, Math.PI * 2);
      o.fill();
      if (i) {
        const q = sm[i - 1], rq = ws[i - 1] / 2;
        const dx = p.x - q.x, dy = p.y - q.y, L = Math.hypot(dx, dy) || 1;
        const nx = -dy / L, ny = dx / L;
        o.beginPath();
        o.moveTo(q.x + nx * rq, q.y + ny * rq);
        o.lineTo(p.x + nx * r, p.y + ny * r);
        o.lineTo(p.x - nx * r, p.y - ny * r);
        o.lineTo(q.x - nx * rq, q.y - ny * rq);
        o.fill();
      }
    }
    // Dry-brush streaks where the brush moved fast.
    const rnd = prng(sm[0].x * 31 + sm[0].y);
    o.globalCompositeOperation = "destination-out";
    o.lineCap = "butt";
    const hairs = 7;
    for (let k = 0; k < hairs; k++) {
      const off = (rnd() - 0.5) * 0.85;
      const thick = 0.4 + rnd() * 1.3;
      const gate = 0.4 + rnd() * 0.5;
      for (let i = 1; i < sm.length; i++) {
        const dry = (sp[i] - gate) * 1.6;
        if (dry <= 0) continue;
        const p = sm[i], q = sm[i - 1];
        const dx = p.x - q.x, dy = p.y - q.y, L = Math.hypot(dx, dy) || 1;
        const nx = -dy / L, ny = dx / L;
        o.globalAlpha = NH.clamp(dry, 0, 0.85);
        o.lineWidth = thick;
        o.beginPath();
        o.moveTo(q.x + nx * ws[i - 1] * off, q.y + ny * ws[i - 1] * off);
        o.lineTo(p.x + nx * ws[i] * off, p.y + ny * ws[i] * off);
        o.stroke();
      }
    }
    o.globalCompositeOperation = "source-over";
    o.globalAlpha = 1;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (bleed && !live) {
      // Ink soaking into the washi: a soft halo under the stroke.
      ctx.globalAlpha = 0.22;
      ctx.filter = "blur(2.5px)";
      ctx.drawImage(off, 0, 0);
      ctx.filter = "none";
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(off, 0, 0);
    ctx.restore();
  }

  // ── neon ─────────────────────────────────────────────────
  function neon(ctx, pts, { w, color = "#ff3ea5", intensity = 1, live = false }) {
    if (!pts.length || intensity <= 0) return;
    const sm = chaikin(pts, 2);
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = color;
    if (live) {
      // While the pen moves this is redrawn every frame, so fake the glow with
      // wide translucent passes; shadowBlur is far too slow on phones.
      for (const [width, alpha] of [[1.9, 0.08], [1.3, 0.14], [0.8, 0.3], [0.42, 0.9]]) {
        ctx.globalAlpha = alpha * intensity;
        ctx.lineWidth = w * width;
        path(ctx, sm);
        ctx.stroke();
      }
      ctx.globalAlpha = 0.9 * intensity;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = w * 0.16;
      path(ctx, sm);
      ctx.stroke();
      ctx.restore();
      return;
    }
    ctx.shadowColor = color;
    ctx.globalAlpha = 0.35 * intensity;
    ctx.shadowBlur = w * 1.8;
    ctx.lineWidth = w * 0.95;
    path(ctx, sm);
    ctx.stroke();
    ctx.globalAlpha = 0.9 * intensity;
    ctx.shadowBlur = w * 0.7;
    ctx.lineWidth = w * 0.42;
    path(ctx, sm);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.9 * intensity;
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = w * 0.16;
    path(ctx, sm);
    ctx.stroke();
    ctx.restore();
  }

  // An unlit glass tube: what the sign looks like before you write on it.
  function tube(ctx, pts, { w }) {
    if (!pts.length) return;
    const sm = chaikin(pts, 1);
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(190, 200, 255, 0.10)";
    ctx.lineWidth = w * 0.46;
    path(ctx, sm);
    ctx.stroke();
    ctx.strokeStyle = "rgba(230, 235, 255, 0.16)";
    ctx.lineWidth = w * 0.08;
    ctx.translate(-w * 0.08, -w * 0.08);
    path(ctx, sm);
    ctx.stroke();
    ctx.restore();
  }

  NH.Ink = { pencil, brush, neon, tube, chaikin, path };
})();

/* js/audio.js */
/* Sound design, synthesized live with the Web Audio API (no audio files).
 *   accuracy    – pencil scratch, marimba blips, school chime
 *   neon        – transformer hum, tube crackle, synthwave chords
 *   calligraphy – brush swish, koto plucks (in-scale), wood block, temple bell */
window.NH = window.NH || {};

(function () {
  let ctx = null, master = null, verb = null, noiseBuf = null;
  let drawing = null; // live nodes for the continuous drawing sound

  const SCALES = {
    accuracy: [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5], // C major pentatonic
    neon: [440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66],         // A minor pentatonic
    calligraphy: [293.66, 311.13, 392, 440, 466.16, 587.33, 622.25, 783.99],   // miyako-bushi on D
  };

  function ensure() {
    if (ctx) {
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = volume();
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp).connect(ctx.destination);
    // A short synthetic reverb shared by the softer sounds.
    verb = ctx.createConvolver();
    verb.buffer = impulse(2.2, 2.5);
    const wet = ctx.createGain();
    wet.gain.value = 0.25;
    verb.connect(wet).connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }

  function impulse(seconds, decay) {
    const len = ctx.sampleRate * seconds;
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  const on = () => NH.store.settings.sound && ensure();
  // Settings store 0–1; the curve gives finer control at the quiet end.
  const volume = () => Math.pow(NH.clamp(NH.store.settings.volume ?? 0.8, 0, 1), 1.6);

  function setVolume(v) {
    NH.store.set("volume", v);
    if (master) master.gain.setTargetAtTime(volume(), ctx.currentTime, 0.02);
  }

  // Short, distinct buzzes: the native haptics engine in the Android app,
  // the Vibration API in browsers that have it (Android Chrome; iOS ignores it).
  const haptics = window.Capacitor?.isNativePlatform?.() && window.Capacitor.Plugins?.Haptics;
  const BUZZ = { accept: 12, reject: [35, 50, 35], complete: [20, 40, 20, 40, 70] };
  const canVibrate = !!haptics || "vibrate" in navigator;
  function vibrate(kind) {
    if (!NH.store.settings.vibrate) return;
    try {
      if (haptics) {
        if (kind === "accept") haptics.impact({ style: "LIGHT" });
        else haptics.notification({ type: kind === "complete" ? "SUCCESS" : "WARNING" });
      } else if (navigator.vibrate) navigator.vibrate(BUZZ[kind] || 10);
    } catch (_) {}
  }
  const now = () => ctx.currentTime;

  function out(node, { reverb = 0 } = {}) {
    node.connect(master);
    if (reverb) {
      const g = ctx.createGain();
      g.gain.value = reverb;
      node.connect(g).connect(verb);
    }
    return node;
  }

  function env(gain, t, a, peak, d, sustain = 0.0001) {
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + a);
    gain.gain.exponentialRampToValueAtTime(sustain, t + a + d);
  }

  function tone(freq, { type = "sine", t = now(), a = 0.005, d = 0.4, peak = 0.3, reverb = 0, detune = 0, filter } = {}) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.detune.value = detune;
    const g = ctx.createGain();
    env(g, t, a, peak, d);
    let node = o.connect(g);
    if (filter) node = node.connect(filter);
    out(node, { reverb });
    o.start(t);
    o.stop(t + a + d + 0.05);
    return o;
  }

  function noise({ t = now(), d = 0.1, peak = 0.3, type = "bandpass", freq = 2000, q = 1, reverb = 0 } = {}) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    f.Q.value = q;
    const g = ctx.createGain();
    env(g, t, 0.002, peak, d);
    out(src.connect(f).connect(g), { reverb });
    src.start(t, Math.random());
    src.stop(t + d + 0.05);
  }

  // Karplus–Strong plucked string, rendered once per pitch and cached.
  const koto = new Map();
  function pluck(freq, { t = now(), peak = 0.5, reverb = 0.5 } = {}) {
    let buf = koto.get(freq);
    if (!buf) {
      const sr = ctx.sampleRate, len = Math.floor(sr * 2.4), N = Math.round(sr / freq);
      buf = ctx.createBuffer(1, len, sr);
      const y = buf.getChannelData(0);
      for (let i = 0; i < N; i++) y[i] = (Math.random() * 2 - 1) * (1 - i / N);
      for (let i = N; i < len; i++) y[i] = 0.4985 * (y[i - N] + y[i - N - 1 < 0 ? 0 : i - N - 1]);
      koto.set(freq, buf);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = peak;
    const f = ctx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = 3200;
    out(src.connect(f).connect(g), { reverb });
    src.start(t);
  }

  function bell(base, t = now()) {
    // Inharmonic partials of a bonshō-like temple bell, with a slow beat.
    const partials = [[0.5, 0.35, 7], [1, 0.3, 6], [1.183, 0.2, 5], [1.506, 0.16, 4], [2, 0.12, 3.5], [2.74, 0.08, 2.5], [3.76, 0.05, 1.6]];
    for (const [r, amp, dur] of partials) {
      tone(base * r, { t, a: 0.004, d: dur, peak: amp * 0.5, reverb: 0.6 });
      tone(base * r * 1.003, { t, a: 0.004, d: dur, peak: amp * 0.2 });
    }
  }

  // Continuous texture while the pen is down; `move(speed)` modulates it.
  function drawStart(style) {
    if (!on()) return;
    drawEnd();
    const t = now();
    const g = ctx.createGain();
    g.gain.value = 0.0001;
    const nodes = [];
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    nodes.push(src);
    if (style === "neon") {
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 520;
      const hum = [55, 110.4, 165.2].map((f) => {
        const o = ctx.createOscillator();
        o.type = "sawtooth";
        o.frequency.value = f;
        o.connect(lp);
        o.start(t);
        nodes.push(o);
        return o;
      });
      const crackle = ctx.createBiquadFilter();
      crackle.type = "highpass";
      crackle.frequency.value = 5000;
      const cg = ctx.createGain();
      cg.gain.value = 0.12;
      src.connect(crackle).connect(cg).connect(g);
      lp.connect(g);
      drawing = { g, nodes, hum, lp, style, base: 0.05, k: 0.12 };
    } else {
      const f1 = ctx.createBiquadFilter();
      const f2 = ctx.createBiquadFilter();
      if (style === "calligraphy") {
        f1.type = "lowpass"; f1.frequency.value = 1300;
        f2.type = "bandpass"; f2.frequency.value = 700; f2.Q.value = 0.6;
      } else {
        f1.type = "highpass"; f1.frequency.value = 1800;
        f2.type = "bandpass"; f2.frequency.value = 4200; f2.Q.value = 0.9;
      }
      src.connect(f1).connect(f2).connect(g);
      drawing = { g, nodes, f2, style, base: 0.01, k: style === "calligraphy" ? 0.5 : 0.22 };
    }
    out(g);
    src.start(t);
  }

  function drawMove(speed) {
    if (!drawing || !ctx) return;
    const t = now();
    const v = Math.min(1, speed);
    drawing.g.gain.setTargetAtTime(drawing.base + drawing.k * v, t, 0.03);
    if (drawing.hum) {
      drawing.hum.forEach((o, i) => o.frequency.setTargetAtTime((55 + v * 18) * (i + 1), t, 0.05));
      drawing.lp.frequency.setTargetAtTime(380 + v * 900, t, 0.05);
    } else if (drawing.f2) {
      drawing.f2.frequency.setTargetAtTime((drawing.style === "calligraphy" ? 500 : 3600) + v * 1400, t, 0.04);
    }
  }

  function drawEnd() {
    if (!drawing || !ctx) return;
    const { g, nodes } = drawing;
    const t = now();
    g.gain.setTargetAtTime(0.0001, t, 0.03);
    nodes.forEach((n) => n.stop(t + 0.2));
    drawing = null;
  }

  function accept(style, i = 0, n = 1) {
    if (!on()) return;
    const scale = SCALES[style] || SCALES.accuracy;
    const f = scale[Math.min(scale.length - 1, Math.round((i / Math.max(1, n - 1)) * (scale.length - 3)))];
    const t = now();
    if (style === "neon") {
      for (let k = 0; k < 4; k++) noise({ t: t + k * 0.035 + Math.random() * 0.02, d: 0.025, peak: 0.25, freq: 3500, q: 0.7 });
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(4000, t + 0.12);
      lp.frequency.exponentialRampToValueAtTime(600, t + 0.6);
      tone(f, { type: "square", t: t + 0.12, d: 0.5, peak: 0.12, filter: lp, reverb: 0.5 });
      tone(f * 2, { type: "sawtooth", t: t + 0.12, d: 0.3, peak: 0.04, detune: 8, reverb: 0.5 });
    } else if (style === "calligraphy") {
      pluck(f, { t, peak: 0.55 });
    } else {
      tone(f, { t, d: 0.35, peak: 0.25 });
      tone(f * 4, { t, d: 0.06, peak: 0.06 });
      noise({ t, d: 0.02, peak: 0.08, freq: 6000 });
    }
  }

  function reject(style) {
    if (!on()) return;
    const t = now();
    if (style === "neon") {
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(320, t);
      o.frequency.exponentialRampToValueAtTime(50, t + 0.35);
      const g = ctx.createGain();
      env(g, t, 0.005, 0.18, 0.35);
      out(o.connect(g));
      o.start(t);
      o.stop(t + 0.4);
      noise({ t, d: 0.2, peak: 0.12, freq: 900, q: 3 });
    } else if (style === "calligraphy") {
      tone(560, { t, d: 0.12, peak: 0.35 });
      tone(1210, { t, d: 0.04, peak: 0.1 });
      noise({ t, d: 0.05, peak: 0.2, freq: 1200, q: 4 });
    } else {
      tone(330, { t, d: 0.12, peak: 0.15 });
      tone(262, { t: t + 0.11, d: 0.2, peak: 0.15 });
    }
  }

  function complete(style, score = 100) {
    if (!on()) return;
    const t = now() + 0.05;
    if (style === "neon") {
      const chord = score >= 75 ? [220, 261.63, 329.63, 493.88] : [220, 261.63, 311.13];
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(300, t);
      lp.frequency.exponentialRampToValueAtTime(3500, t + 0.6);
      lp.frequency.exponentialRampToValueAtTime(700, t + 2);
      lp.Q.value = 6;
      out(lp, { reverb: 0.6 });
      for (const f of chord) {
        for (const det of [-9, 9]) {
          const o = ctx.createOscillator();
          o.type = "sawtooth";
          o.frequency.value = f;
          o.detune.value = det;
          const g = ctx.createGain();
          env(g, t, 0.08, 0.05, 2.2);
          o.connect(g).connect(lp);
          o.start(t);
          o.stop(t + 2.4);
        }
      }
      SCALES.neon.slice(0, 6).forEach((f, k) => tone(f * 2, { type: "square", t: t + k * 0.09, d: 0.18, peak: 0.05, reverb: 0.7 }));
    } else if (style === "calligraphy") {
      // stamp thud, hyoshigi clap, then the bell
      tone(90, { t, d: 0.25, peak: 0.5 });
      noise({ t, d: 0.08, peak: 0.3, type: "lowpass", freq: 500 });
      for (const k of [0.35, 0.47]) {
        noise({ t: t + k, d: 0.06, peak: 0.6, freq: 2400, q: 6, reverb: 0.8 });
        tone(1850, { t: t + k, d: 0.05, peak: 0.15 });
      }
      bell(score >= 75 ? 196 : 174.6, t + 0.75);
    } else {
      const notes = score >= 90 ? [523.25, 659.25, 783.99, 1046.5] : [523.25, 659.25, 783.99];
      notes.forEach((f, k) => {
        tone(f, { t: t + k * 0.11, d: 0.6, peak: 0.2, reverb: 0.4 });
        tone(f * 3, { t: t + k * 0.11, d: 0.15, peak: 0.04 });
      });
    }
  }

  function tap() {
    if (!on()) return;
    tone(1400, { d: 0.03, peak: 0.05 });
  }

  NH.Audio = { unlock: ensure, drawStart, drawMove, drawEnd, accept, reject, complete, tap, setVolume, vibrate, canVibrate, pluck: (f) => on() && pluck(f) };
})();

/* js/tts.js */
/* Japanese speech.
 * Web: the browser's built-in speech synthesis (Web Speech API). On Android
 * this is Google's offline TTS, on iOS/macOS "Kyoko"/"O-ren", on Windows
 * "Nanami"/"Haruka". No network or API key needed.
 * Android app: the WebView has no speech synthesis, so speech goes through
 * Android's own text-to-speech engine (@capacitor-community/text-to-speech). */
window.NH = window.NH || {};

(function () {
  const synth = window.speechSynthesis;
  const native = window.Capacitor?.isNativePlatform?.() && window.Capacitor.Plugins?.TextToSpeech;
  let voices = [];
  let nativeJapanese = false;
  const listeners = new Set();
  const notify = () => listeners.forEach((fn) => fn(voices));

  // Natural-sounding voices first; fall back to any ja-JP voice.
  const PREFERRED = [/nanami/i, /google.*日本語|日本語.*google/i, /kyoko.*(enhanced|premium)/i, /o-ren/i, /kyoko/i, /haruka/i, /ayumi/i, /otoya/i];
  const rank = (v) => {
    const i = PREFERRED.findIndex((re) => re.test(v.name));
    return i < 0 ? 99 : i;
  };
  const isJa = (lang) => /^ja([-_]|$)/i.test(lang || "");

  function loadWeb() {
    voices = synth.getVoices().filter((v) => isJa(v.lang));
    voices.sort((a, b) => rank(a) - rank(b));
    notify();
  }

  async function loadNative() {
    try {
      nativeJapanese = (await native.isLanguageSupported({ lang: "ja-JP" })).supported;
      // `voice` in speak() is an index into the full list, so remember it.
      const all = (await native.getSupportedVoices()).voices || [];
      voices = all.map((v, index) => ({ name: v.name, lang: v.lang, localService: v.localService !== false, index })).filter((v) => isJa(v.lang));
    } catch (_) {
      voices = [];
    }
    notify();
  }

  if (native) loadNative();
  else if (synth) {
    loadWeb();
    synth.addEventListener ? synth.addEventListener("voiceschanged", loadWeb) : (synth.onvoiceschanged = loadWeb);
  }

  function pick() {
    const want = NH.store.settings.voice;
    return voices.find((v) => v.name === want) || voices[0] || null;
  }

  // Lone small kana and particles read oddly on their own; say what a teacher would.
  const SAY = { "っ": "ちいさい つ", "ゃ": "ちいさい や", "ゅ": "ちいさい ゆ", "ょ": "ちいさい よ", "ぁ": "ちいさい あ", "ぃ": "ちいさい い", "ぅ": "ちいさい う", "ぇ": "ちいさい え", "ぉ": "ちいさい お", "ゎ": "ちいさい わ", "を": "を", "ゐ": "い", "ゑ": "え", "ぢ": "ぢ", "づ": "づ" };

  function speak(text, { rate } = {}) {
    const say = SAY[text] || text;
    const r = rate || NH.store.settings.rate || 0.85;
    const v = pick();
    if (native) {
      native.stop().catch(() => {}).finally(() =>
        native.speak({ text: say, lang: "ja-JP", rate: r, pitch: 1, volume: 1, ...(v ? { voice: v.index } : {}) }).catch(() => {}));
      return true;
    }
    if (!synth) return false;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(say);
    u.lang = "ja-JP";
    if (v) u.voice = v;
    u.rate = r;
    u.pitch = 1;
    synth.speak(u);
    return true;
  }

  NH.TTS = {
    native: !!native,
    get supported() { return !!(native || synth); },
    get voices() { return voices; },
    get hasJapanese() { return native ? nativeJapanese || voices.length > 0 : voices.length > 0; },
    speak,
    // Android app only: opens the system screen to download voice data.
    installVoice() { return native ? native.openInstall().catch(() => {}) : null; },
    onVoices(fn) { listeners.add(fn); return () => listeners.delete(fn); },
  };
})();

/* js/backdrops.js */
/* Backdrops for the writing stage, all vector:
 *   accuracy    – a school notebook page with ballpoint doodles in the margins
 *   neon        – Tokyo at night: skyline, lit windows, vertical neon signs
 *   calligraphy – washi paper with faint sumi-e: pagoda, torii, Fuji, sakura,
 *                 seigaiha waves, ginkgo leaves
 * Words add their own scene art (waves for water words, Skytree for Oshiage…). */
window.NH = window.NH || {};

(function () {
  const { h, s, rand } = NH;

  function art(id, cls, style) {
    const a = NH.SCENE_ART && NH.SCENE_ART[id];
    if (!a) return null;
    const el = s("svg.art", { viewBox: a.vb, preserveAspectRatio: "xMidYMid meet", class: cls || "", "aria-hidden": "true" });
    el.innerHTML = a.svg;
    for (const [k, v] of Object.entries(style || {})) el.style.setProperty(k.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase()), v);
    return el;
  }

  // Seeded random so the same word always gets the same city.
  function prng(seed) {
    let x = (seed % 2147483646) + 1;
    return () => ((x = (x * 16807) % 2147483647) / 2147483647);
  }

  // ── notebook ─────────────────────────────────────────────
  function notebook(el, scenes) {
    el.append(
      h("div.nb-holes", Array.from({ length: 9 }, () => h("span"))),
      h("div.nb-head", h("span", "No."), h("i"), h("span", "Date"), h("i.short"), h("b", "."), h("i.short"), h("b", "."), h("i.short"))
    );
    const ids = scenes.length ? scenes : ["sakura", "cat", "fuji", "train"];
    const slots = [
      { left: "3%", bottom: "4%", width: "min(30vw, 220px)", rotate: "-6deg" },
      { right: "3%", top: "12%", width: "min(24vw, 170px)", rotate: "8deg" },
      { right: "4%", bottom: "6%", width: "min(26vw, 190px)", rotate: "-3deg" },
      { left: "5%", top: "16%", width: "min(20vw, 140px)", rotate: "5deg" },
    ];
    ids.slice(0, 4).forEach((id, i) => {
      const { rotate, ...pos } = slots[i];
      const a = art(id, "doodle" + (scenes.length && i === 0 ? " hero" : ""), { ...pos, transform: `rotate(${rotate})` });
      if (a) el.append(a);
    });
  }

  // ── neon city ────────────────────────────────────────────
  const SIGNS = ["ラーメン", "カラオケ", "居酒屋", "喫茶", "ゲーム", "寿司", "薬", "本屋", "温泉", "バー"];
  const NEONS = ["#ff3ea5", "#38f3ff", "#ffe14d", "#b46bff", "#5dff9e", "#ff8a3d"];

  function neon(el, scenes, seed) {
    const rnd = prng(seed || 1234);
    const W = 1600, H = 900, horizon = 660;
    const svg = s("svg.city", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "xMidYMax slice", "aria-hidden": "true" });
    svg.append(
      s("defs",
        s("linearGradient", { id: "ng-sky", x1: 0, y1: 0, x2: 0, y2: 1 },
          s("stop", { offset: "0", "stop-color": "#05041a" }),
          s("stop", { offset: "0.55", "stop-color": "#160a3a" }),
          s("stop", { offset: "0.8", "stop-color": "#3d0f4f" }),
          s("stop", { offset: "1", "stop-color": "#6b1450" })),
        s("linearGradient", { id: "ng-street", x1: 0, y1: 0, x2: 0, y2: 1 },
          s("stop", { offset: "0", "stop-color": "#140a2a" }),
          s("stop", { offset: "1", "stop-color": "#05040e" })),
        s("filter", { id: "ng-glow", x: "-50%", y: "-50%", width: "200%", height: "200%" },
          s("feGaussianBlur", { stdDeviation: "4", result: "b" }),
          s("feMerge", s("feMergeNode", { in: "b" }), s("feMergeNode", { in: "b" }), s("feMergeNode", { in: "SourceGraphic" })))),
      s("rect", { width: W, height: H, fill: "url(#ng-sky)" })
    );
    // stars
    const stars = s("g.stars");
    for (let i = 0; i < 90; i++) stars.append(s("circle", { cx: rnd() * W, cy: rnd() * horizon * 0.6, r: rnd() * 1.4 + 0.3, style: `animation-delay:${(rnd() * 6).toFixed(2)}s` }));
    svg.append(stars);
    // far skyline
    const far = s("g.far");
    for (let x = -20; x < W; ) {
      const bw = 40 + rnd() * 90, bh = 120 + rnd() * 260;
      far.append(s("rect", { x, y: horizon - bh, width: bw, height: bh + 4 }));
      if (rnd() < 0.3) far.append(s("rect.blink", { x: x + bw / 2 - 1.5, y: horizon - bh - 14, width: 3, height: 14, style: `animation-delay:${(rnd() * 3).toFixed(2)}s` }));
      x += bw + rnd() * 6;
    }
    svg.append(far);
    // near buildings with windows and neon signs
    const near = s("g.near");
    const windows = s("g.windows");
    const signs = s("g.signs");
    let signNo = (seed || 0) % SIGNS.length;
    for (let x = -30; x < W; ) {
      const bw = 90 + rnd() * 150, bh = 160 + rnd() * 330;
      const top = horizon + 120 - bh;
      near.append(s("rect", { x, y: top, width: bw, height: bh + 200 }));
      for (let wy = top + 18; wy < horizon + 100; wy += 22) {
        for (let wx = x + 10; wx < x + bw - 14; wx += 18) {
          if (rnd() < 0.42) windows.append(s("rect", { x: wx, y: wy, width: 9, height: 12, class: rnd() < 0.2 ? "cool" : "" }));
        }
      }
      if (rnd() < 0.55 && bh > 260) {
        const word = SIGNS[signNo++ % SIGNS.length];
        const color = NEONS[(rnd() * NEONS.length) | 0];
        const sx = x + (rnd() < 0.5 ? 8 : bw - 46), sy = top + 30;
        const g = s("g.sign", { style: `--c:${color};animation-delay:${(rnd() * 8).toFixed(2)}s`, filter: "url(#ng-glow)" });
        g.append(s("rect", { x: sx, y: sy, width: 38, height: [...word].length * 40 + 16, rx: 4 }));
        [...word].forEach((c, i) => g.append(s("text", { x: sx + 19, y: sy + 42 + i * 40, "text-anchor": "middle" }, c)));
        signs.append(g);
      }
      x += bw + rnd() * 10;
    }
    svg.append(near, windows, signs);
    // wet street with reflections
    svg.append(s("rect", { x: 0, y: horizon + 120, width: W, height: H - horizon - 120, fill: "url(#ng-street)" }));
    const refl = s("g.reflect");
    for (let i = 0; i < 26; i++) {
      const x = rnd() * W;
      refl.append(s("rect", { x, y: horizon + 124, width: 3 + rnd() * 10, height: 40 + rnd() * 110, style: `--c:${NEONS[(rnd() * NEONS.length) | 0]}` }));
    }
    svg.append(refl);
    el.append(svg);

    // landmark or scene art lit as neon over the skyline
    const ids = scenes.length ? scenes : [rnd() < 0.5 ? "tokyotower" : "skytree"];
    ids.slice(0, 2).forEach((id, i) => {
      const color = i === 0 ? (id === "tokyotower" ? "#ff8a3d" : "#38f3ff") : "#ff3ea5";
      const a = art(id, "neon-art" + (i === 0 ? " hero" : ""), {
        ...(i === 0 ? { right: "6%", bottom: "26%", height: "min(46vh, 380px)" } : { left: "5%", top: "8%", height: "min(22vh, 170px)" }),
        "--c": color,
      });
      if (a) el.append(a);
    });
    if (scenes.includes("rain")) el.append(rain());
  }

  function rain() {
    const g = h("div.rain");
    for (let i = 0; i < 70; i++) {
      g.append(h("i", { style: { left: `${rand(-10, 110)}%`, animationDelay: `${rand(0, 1.2).toFixed(2)}s`, animationDuration: `${rand(0.5, 0.9).toFixed(2)}s`, opacity: rand(0.25, 0.6).toFixed(2) } }));
    }
    return g;
  }

  // ── washi + sumi-e ───────────────────────────────────────
  function washi(el, scenes) {
    const tex = s("svg.washi-tex", { "aria-hidden": "true", preserveAspectRatio: "none" },
      s("filter", { id: "washi-f" },
        s("feTurbulence", { type: "fractalNoise", baseFrequency: "0.012 0.09", numOctaves: "3", seed: "4" }),
        s("feColorMatrix", { values: "0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.2  0 0 0 0.55 -0.18" })),
      s("rect", { width: "100%", height: "100%", filter: "url(#washi-f)" }));
    el.append(tex);

    // seigaiha band along the bottom
    const sg = NH.SCENE_ART && NH.SCENE_ART.seigaiha;
    if (sg) {
      const band = s("svg.seigaiha", { "aria-hidden": "true", preserveAspectRatio: "none" });
      const [, , tw, th] = sg.vb.split(" ").map(Number);
      const pat = s("pattern", { id: "sg-pat", width: tw, height: th, patternUnits: "userSpaceOnUse", patternTransform: "scale(1.6)" });
      pat.innerHTML = sg.svg; // the tile already contains its offset rows
      band.append(s("defs", pat), s("rect", { width: "100%", height: "100%", fill: "url(#sg-pat)" }));
      el.append(band);
    }

    const hero = scenes[0];
    const layout = [
      ["fuji", { left: "50%", top: "4%", width: "min(56vw, 520px)", transform: "translateX(-50%)", opacity: 0.55 }],
      ["sakura", { right: "-2%", top: "-1%", width: "min(42vw, 360px)", transform: "scaleX(-1)" }],
      ["pagoda", { left: "2%", bottom: "13%", height: "min(40vh, 320px)" }],
      ["torii", { right: "3%", bottom: "12%", width: "min(26vw, 210px)" }],
      ["flower", { left: "3%", top: "8%", width: "min(16vw, 120px)", opacity: 0.6 }],
    ];
    if (hero) {
      // The word's own scene takes the sky; keep two quiet companions.
      el.append(art(hero, "sumi hero", { left: "50%", top: "7%", width: "min(80vw, 640px)", height: "min(36vh, 320px)", transform: "translateX(-50%)" }) || "");
      if (scenes[1]) el.append(art(scenes[1], "sumi", { right: "3%", bottom: "12%", width: "min(26vw, 210px)" }) || "");
      for (const [id, st] of [layout[2], layout[1]]) if (!scenes.includes(id)) el.append(art(id, "sumi faint", st) || "");
    } else {
      for (const [id, st] of layout) el.append(art(id, "sumi", st) || "");
    }
    // ginkgo leaves and petals drifting down
    const drift = h("div.drift");
    for (let i = 0; i < 9; i++) {
      const id = i % 3 === 0 ? "ginkgo" : "petal";
      const a = art(id, "drifter " + id, { left: `${rand(0, 96)}%`, animationDelay: `${rand(-20, 0).toFixed(1)}s`, animationDuration: `${rand(16, 28).toFixed(1)}s`, width: id === "ginkgo" ? "26px" : "14px" });
      if (a) drift.append(a);
    }
    el.append(drift);
  }

  NH.Backdrop = {
    render(el, style, scenes = [], seed = 0) {
      el.replaceChildren();
      el.className = "backdrop bd-" + style;
      if (style === "neon") neon(el, scenes, seed);
      else if (style === "calligraphy") washi(el, scenes);
      else notebook(el, scenes);
    },
    art,
  };
})();

/* js/writer.js */
/* The writing engine: one practice cell where the learner writes a character
 * stroke by stroke. It draws the guides for the chosen assist level, grades
 * each stroke against KanjiVG's reference, renders ink in the chosen style,
 * and finishes with a style-specific mark (teacher's hanamaru, hanko seal or
 * neon sign). Coordinates are kept in the 109-unit box and scaled on render. */
window.NH = window.NH || {};

(function () {
  const { h, s, Geo, Ink, Audio, clamp, rand, lerp } = NH;
  const BOX = 109;

  const NEON = ["#ff3ea5", "#38f3ff", "#ffe14d", "#b46bff", "#5dff9e", "#ff8a3d"];
  const SHU = "#c8382e";

  // How much help each assist level gives.
  const ASSIST = {
    trace: { ghost: 1, numbers: "all", loopHint: true, startDot: true, hintAfter: 1 },
    guide: { ghost: 0.5, numbers: "next", loopHint: false, startDot: true, hintAfter: 2 },
    memory: { ghost: 0, numbers: "none", loopHint: false, startDot: false, hintAfter: 3 },
  };

  const GRADES = {
    accuracy: [[90, "hanamaru", "Hanamaru! 花丸"], [75, "double", "Excellent ◎"], [60, "single", "Good ○"], [0, "triangle", "Almost △"]],
    calligraphy: [[90, "秀", "秀 shū · outstanding"], [75, "優", "優 yū · excellent"], [60, "良", "良 ryō · good"], [0, "可", "可 ka · passing"]],
    neon: [[90, "完璧", "完璧 kanpeki · perfect"], [75, "上手", "上手 jōzu · skilful"], [60, "いいね", "いいね · nice"], [0, "もう一回", "もう一回 · once more"]],
  };
  const gradeFor = (style, score) => GRADES[style].find(([min]) => score >= min);

  let uid = 0;

  class Writer {
    constructor(host, opts = {}) {
      this.host = host;
      this.style = opts.style || "accuracy";
      this.assist = opts.assist || "trace";
      this.onEvent = opts.onEvent || (() => {});
      this.colorIndex = opts.colorIndex || 0;
      this.id = "w" + uid++;
      this.particles = [];
      this.anim = new Set(); // running tube animations (neon)
      this.build();
      this.ro = new ResizeObserver(() => this.layout());
      this.ro.observe(this.host);
    }

    build() {
      this.host.classList.add("cell");
      this.guides = s("svg.guides", { viewBox: `0 0 ${BOX} ${BOX}`, "aria-hidden": "true" });
      this.ghost = s("svg.ghost", { viewBox: `0 0 ${BOX} ${BOX}`, "aria-hidden": "true" });
      this.ink = h("canvas.ink");
      this.live = h("canvas.live");
      this.hints = s("svg.hints", { viewBox: `0 0 ${BOX} ${BOX}`, "aria-hidden": "true" });
      this.marks = s("svg.marks", { viewBox: `0 0 ${BOX} ${BOX}`, "aria-hidden": "true" });
      this.badges = h("div.badges");
      this.host.append(this.guides, this.ghost, this.ink, this.live, this.hints, this.marks, this.badges);
      this.fx = h("canvas.fx", { "aria-hidden": "true" });
      document.body.append(this.fx);
      this.live.setAttribute("role", "img");
      this.live.setAttribute("aria-label", "Writing area. Draw the character with your finger, pen or mouse.");
      // Screen readers get every stroke described in words.
      this.desc = h("div.vh", { id: `${this.id}-desc` });
      this.host.append(this.desc);
      this.live.setAttribute("aria-describedby", this.desc.id);
      this.bindPointer();
    }

    destroy() {
      this.ro.disconnect();
      cancelAnimationFrame(this.raf);
      cancelAnimationFrame(this.fxRaf);
      this.demoToken = null;
      Audio.drawEnd();
      this.fx.remove();
    }

    // ── setup ──────────────────────────────────────────────
    setChar(ch, colorIndex = this.colorIndex) {
      this.ch = ch;
      this.colorIndex = colorIndex;
      this.color = NEON[colorIndex % NEON.length];
      this.strokes = Geo.strokesOf(ch);
      this.desc.textContent = `${ch}, ${this.strokes.length} stroke${this.strokes.length === 1 ? "" : "s"}. ` +
        this.strokes.map((st, i) => `Stroke ${i + 1} ${Geo.describe(st)}.`).join(" ");
      this.reset();
    }

    reset() {
      this.done = new Set();
      this.user = []; // accepted strokes: { pts (box units, with t/p), acc, idx }
      this.tubes = []; // neon: { idx, pts, born, from }
      this.misses = 0;
      this.missesHere = 0;
      this.finished = false;
      this.demoToken = null;
      this.marks.replaceChildren();
      this.badges.replaceChildren();
      this.layout();
    }

    setStyle(style) {
      this.style = style;
      // Strokes written in another style become lit tubes straight away.
      if (style === "neon" && this.tubes.length < this.user.length) {
        const born = performance.now() - 2000;
        this.tubes = this.user.map((u) => ({ idx: u.idx, from: this.strokes[u.idx].pts, to: this.strokes[u.idx].pts, born, color: this.color }));
      }
      this.layout();
      if (this.finished) this.finish(true);
    }

    setAssist(assist) {
      this.assist = assist;
      this.drawGhost();
      this.drawHints();
    }

    describeStroke(i) { return this.strokes[i] ? `Stroke ${i + 1} ${Geo.describe(this.strokes[i])}.` : ""; }

    get next() {
      if (!this.strokes) return -1;
      for (let i = 0; i < this.strokes.length; i++) if (!this.done.has(i)) return i;
      return -1;
    }

    layout() {
      const size = Math.floor(Math.min(this.host.clientWidth, this.host.clientHeight || this.host.clientWidth));
      if (!size) return;
      this.size = size;
      this.k = size / BOX;
      this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      for (const c of [this.ink, this.live]) {
        c.width = Math.round(size * this.dpr);
        c.height = Math.round(size * this.dpr);
        c.getContext("2d").setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }
      this.sizeFx();
      this.drawGuides();
      this.drawGhost();
      this.drawHints();
      this.renderInk();
    }

    sizeFx() {
      const d = this.dpr || 1;
      this.fx.width = Math.round(innerWidth * d);
      this.fx.height = Math.round(innerHeight * d);
      this.fx.getContext("2d").setTransform(d, 0, 0, d, 0, 0);
    }

    // Brush/pen width in px for the current cell.
    get w() {
      return this.size * (this.style === "calligraphy" ? 0.064 : this.style === "neon" ? 0.06 : 0.07);
    }

    toPx(p) { return { x: p.x * this.k, y: p.y * this.k, t: p.t, p: p.p }; }

    // ── static layers ──────────────────────────────────────
    drawGuides() {
      const g = this.guides;
      g.replaceChildren();
      const mid = BOX / 2;
      // The dashed cross of a Japanese practice notebook (十字リーダー).
      g.append(
        s("line.cross", { x1: mid, y1: 3, x2: mid, y2: BOX - 3 }),
        s("line.cross", { x1: 3, y1: mid, x2: BOX - 3, y2: mid })
      );
      if (this.style === "calligraphy") {
        // Fold marks on a sheet of hanshi.
        g.append(s("line.fold", { x1: 3, y1: 3, x2: BOX - 3, y2: BOX - 3 }), s("line.fold", { x1: BOX - 3, y1: 3, x2: 3, y2: BOX - 3 }));
      }
    }

    drawGhost() {
      const g = this.ghost;
      g.replaceChildren();
      if (!this.strokes) return;
      const a = ASSIST[this.assist];
      g.style.opacity = a.ghost;
      const next = this.next;
      if (a.ghost > 0 && this.style !== "neon") {
        this.strokes.forEach((st, i) => g.append(s("path.gs", { d: st.d, class: i === next && this.assist === "trace" ? "is-next" : "" })));
      }
      this.strokes.forEach((st, i) => {
        const show = a.numbers === "all" ? !this.done.has(i) : a.numbers === "next" ? i === next : false;
        if (!show) return;
        const p = Geo.labelPos(st);
        g.append(s("g.num", { class: i === next ? "is-next" : "", transform: `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})` },
          s("circle", { r: 4.6 }), s("text", { "text-anchor": "middle", dy: "1.9" }, String(i + 1))));
      });
      if (this.style === "neon") g.style.opacity = 1;
    }

    // Animated guidance for the next stroke.
    drawHints(force = false) {
      const g = this.hints;
      g.replaceChildren();
      const i = this.next;
      if (i < 0 || this.finished || !this.strokes) return;
      const a = ASSIST[this.assist];
      const st = this.strokes[i];
      const showLoop = a.loopHint || force;
      if (showLoop) {
        const id = `${this.id}-p${i}`;
        g.append(
          s("path.hint-path", { id, d: st.d, pathLength: "100", class: force && !a.loopHint ? "once" : "" }),
          s("circle.hint-pen", { r: 3.2 },
            s("animateMotion", { dur: `${(0.5 + st.len / 90).toFixed(2)}s`, repeatCount: force && !a.loopHint ? "2" : "indefinite", rotate: "auto", fill: "freeze" },
              s("mpath", { href: `#${id}` })))
        );
        // arrowhead at the stroke end
        const p = st.pts[st.pts.length - 1], q = st.pts[st.pts.length - 4];
        const ang = (Math.atan2(p.y - q.y, p.x - q.x) * 180) / Math.PI;
        g.append(s("path.hint-arrow", { d: "M-3,-3 L1.5,0 L-3,3", transform: `translate(${p.x} ${p.y}) rotate(${ang})` }));
      }
      if (a.startDot || force) {
        const p0 = st.pts[0];
        g.append(s("circle.hint-start", { cx: p0.x, cy: p0.y, r: 2.6 }));
      }
    }

    // ── ink ────────────────────────────────────────────────
    renderInk(now = performance.now()) {
      const c = this.ink.getContext("2d");
      c.clearRect(0, 0, this.size, this.size);
      if (!this.strokes) return;
      const w = this.w;
      if (this.style === "neon") {
        if (ASSIST[this.assist].ghost > 0 || this.finished) {
          this.strokes.forEach((st, i) => {
            if (!this.done.has(i)) Ink.tube(c, st.raw.map((p) => this.toPx(p)), { w });
          });
        }
        let animating = false;
        for (const tb of this.tubes) {
          const age = now - tb.born;
          const morph = clamp(age / 240, 0, 1);
          const e = 1 - Math.pow(1 - morph, 3);
          const pts = tb.to.map((p, j) => this.toPx({ x: lerp(tb.from[j].x, p.x, e), y: lerp(tb.from[j].y, p.y, e) }));
          let I = 1;
          if (age < 700) {
            animating = true;
            const f = age < 240 ? 0.55 : [0.1, 1, 0.3, 1, 0.6, 1, 1][Math.floor((age - 240) / 65)] ?? 1;
            I = f;
          }
          if (tb.surge) {
            const sa = now - tb.surge;
            if (sa < 1400) { animating = true; I *= 1 + 0.6 * Math.max(0, Math.sin(sa / 70)) * (1 - sa / 1400); }
          }
          Ink.neon(c, pts, { w, color: tb.color, intensity: I });
        }
        if (animating) {
          cancelAnimationFrame(this.raf);
          this.raf = requestAnimationFrame((t) => this.renderInk(t));
        }
      } else {
        for (const u of this.user) this.paint(c, u.pts.map((p) => this.toPx(p)), false);
      }
    }

    paint(ctx, pts, live) {
      const w = this.w;
      if (this.style === "calligraphy") Ink.brush(ctx, pts, { w, scale: 360 / this.size, live });
      else if (this.style === "neon") Ink.neon(ctx, pts, { w, color: this.color, intensity: live ? 0.85 : 1, live });
      else Ink.pencil(ctx, pts, { w });
    }

    renderLive() {
      const c = this.live.getContext("2d");
      c.clearRect(0, 0, this.size, this.size);
      if (this.cur && this.cur.length) this.paint(c, this.cur, true);
    }

    // ── input ──────────────────────────────────────────────
    bindPointer() {
      const el = this.live;
      const pos = (e) => {
        const r = el.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top, t: e.timeStamp, p: e.pressure };
      };
      el.addEventListener("pointerdown", (e) => {
        if (this.finished || this.demoToken || this.next < 0) return;
        if (this.pointer != null) return;
        e.preventDefault();
        Audio.unlock();
        el.setPointerCapture(e.pointerId);
        this.pointer = e.pointerId;
        this.cur = [pos(e)];
        this.lastFx = 0;
        this.live.classList.remove("fade");
        Audio.drawStart(this.style);
        this.renderLive();
      });
      el.addEventListener("pointermove", (e) => {
        if (e.pointerId !== this.pointer) return;
        const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of evs.length ? evs : [e]) {
          const p = pos(ev);
          const l = this.cur[this.cur.length - 1];
          if (Math.hypot(p.x - l.x, p.y - l.y) < 0.8) continue;
          this.cur.push(p);
        }
        const n = this.cur.length;
        if (n > 2) {
          const a = this.cur[n - 1], b = this.cur[Math.max(0, n - 4)];
          const v = Math.hypot(a.x - b.x, a.y - b.y) / Math.max(8, a.t - b.t) * (360 / this.size);
          Audio.drawMove(v / 1.6);
          this.penFx(a, v);
        }
        if (!this.liveQueued) {
          this.liveQueued = true;
          requestAnimationFrame(() => { this.liveQueued = false; this.renderLive(); });
        }
      });
      const up = (e) => {
        if (e.pointerId !== this.pointer) return;
        this.pointer = null;
        Audio.drawEnd();
        const pts = this.cur;
        this.cur = null;
        if (pts && pts.length) this.evaluate(pts);
      };
      el.addEventListener("pointerup", up);
      el.addEventListener("pointercancel", (e) => {
        if (e.pointerId !== this.pointer) return;
        this.pointer = null;
        this.cur = null;
        Audio.drawEnd();
        this.renderLive();
      });
    }

    evaluate(pxPts) {
      const box = pxPts.map((p) => ({ x: p.x / this.k, y: p.y / this.k, t: p.t, p: p.p }));
      const expected = this.next;
      const res = Geo.judge(box, this.strokes, expected, this.done, this.assist);
      if (res.status === "ok") {
        // A hane stroke written without its flick still counts, with a tip and a small deduction.
        const ref = this.strokes[expected];
        const hane = ref.hane ? (Geo.hasHook(box) ? "ok" : "missing") : null;
        const acc = hane === "missing" ? Math.max(0, res.grade.accuracy - 8) : res.grade.accuracy;
        this.accept(expected, box, pxPts, acc, hane);
      }
      else this.reject(res, pxPts);
    }

    accept(idx, box, pxPts, acc, hane = null) {
      this.done.add(idx);
      this.user.push({ idx, pts: box, acc, hane });
      this.missesHere = 0;
      Audio.accept(this.style, this.done.size - 1, this.strokes.length);
      Audio.vibrate("accept");
      const ref = this.strokes[idx];
      const end = pxPts[pxPts.length - 1];
      if (this.style === "neon") {
        const N = ref.pts.length;
        this.tubes.push({ idx, from: Geo.resample(box, N), to: ref.pts, born: performance.now(), color: this.color });
        this.sparks(ref.pts.map((p) => this.toPx(p)), this.color, 22);
      } else if (this.style === "calligraphy") {
        const n = pxPts.length;
        const a = pxPts[n - 1], b = pxPts[Math.max(0, n - 5)];
        const v = Math.hypot(a.x - b.x, a.y - b.y) / Math.max(8, a.t - b.t) * (360 / this.size);
        if (v > 1.4) this.splatter(a, Math.atan2(a.y - b.y, a.x - b.x), v);
      } else {
        this.badge(end, acc);
        if (acc < 85 && hane !== "missing") this.showRef(idx);
      }
      if (hane === "missing") this.showHane(idx);
      this.clearLive(false);
      this.renderInk();
      this.drawGhost();
      this.drawHints();
      this.onEvent({ type: "stroke", ok: true, index: idx, total: this.strokes.length, accuracy: acc, hane });
      if (this.next < 0) setTimeout(() => this.finish(), this.style === "neon" ? 650 : 250);
    }

    reject(res, pxPts) {
      this.misses++;
      this.missesHere++;
      Audio.reject(this.style);
      Audio.vibrate("reject");
      const n = this.next + 1;
      let msg;
      if (res.status === "order") msg = `That's stroke ${res.actual + 1}. Stroke order matters: write stroke ${n} first.`;
      else if (res.status === "reversed") msg = `Right shape, wrong direction. Start stroke ${n} from the other end.`;
      else msg = this.assist === "memory" && this.missesHere < 3 ? `Not quite. Think about where stroke ${n} starts.` : `Not quite. Follow stroke ${n}${ASSIST[this.assist].startDot ? " from the dot" : ""}.`;
      if (this.style === "accuracy") this.dust(pxPts);
      this.clearLive(true);
      this.host.classList.remove("shake");
      void this.host.offsetWidth;
      this.host.classList.add("shake");
      if (this.missesHere >= ASSIST[this.assist].hintAfter) this.drawHints(true);
      this.onEvent({ type: "stroke", ok: false, status: res.status, message: msg, index: this.next, total: this.strokes.length });
    }

    clearLive(fade) {
      if (!fade) { this.renderLive(); return; }
      this.live.classList.add("fade");
      setTimeout(() => {
        this.live.classList.remove("fade");
        if (!this.cur) this.renderLive();
      }, 380);
    }

    // ── finishing ──────────────────────────────────────────
    get score() {
      if (!this.user.length) return 0;
      const mean = this.user.reduce((a, u) => a + u.acc, 0) / this.user.length;
      return Math.round(clamp(mean - this.misses * 4, 0, 100));
    }

    finish(redraw = false) {
      this.finished = true;
      const score = this.score;
      const [, mark, label] = gradeFor(this.style, score);
      this.drawHints();
      this.marks.replaceChildren();
      // Memory mode (and a shaky notebook attempt) gets the model laid over it to compare.
      if (this.assist === "memory" || (this.style === "accuracy" && score < 90)) this.overlayReference();
      if (this.style === "accuracy") this.teacherMark(mark, score);
      else if (this.style === "calligraphy") this.hanko(mark);
      else this.neonSign(mark, score);
      if (!redraw) {
        Audio.complete(this.style, score);
        Audio.vibrate("complete");
        if (this.style === "neon") {
          const t = performance.now();
          this.tubes.forEach((tb) => (tb.surge = t));
          this.renderInk();
          this.strokes.forEach((st, i) => setTimeout(() => this.sparks(st.pts.map((p) => this.toPx(p)), NEON[(this.colorIndex + i) % NEON.length], 18), i * 90));
        } else if (this.style === "calligraphy") {
          this.petals(26);
        }
        this.onEvent({ type: "done", score, misses: this.misses, label, strokes: this.user.map((u) => u.acc), haneMissed: this.user.filter((u) => u.hane === "missing").length });
      }
    }

    // Thin vermilion reference lines over the learner's strokes, for comparison.
    overlayReference() {
      const g = s("g.ref-overlay");
      this.strokes.forEach((st) => g.append(s("path", { d: st.d })));
      this.marks.append(g);
    }

    teacherMark(kind, score) {
      // Drawn around (0,0), then placed in the top-right corner like a teacher's mark.
      const g = s("g.teacher", { transform: "translate(86 23) scale(0.62)" });
      if (kind === "hanamaru") {
        // a spiral, then a ring of petals around it — the classic 花丸
        let d = "";
        for (let a = 0; a <= Math.PI * 2 * 2.3; a += 0.12) {
          const r = 3 + a * 1.4;
          d += `${d ? "L" : "M"}${(Math.cos(a) * r).toFixed(2)},${(Math.sin(a) * r * 0.9).toFixed(2)}`;
        }
        let f = "";
        for (let a = 0; a <= Math.PI * 2 + 0.05; a += 0.05) {
          const r = 21 + 6 * Math.abs(Math.sin(3.5 * a));
          f += `${f ? "L" : "M"}${(Math.cos(a - 1.2) * r).toFixed(2)},${(Math.sin(a - 1.2) * r * 0.9).toFixed(2)}`;
        }
        g.append(s("path.mark-line", { d, pathLength: "100" }), s("path.mark-line.late", { d: f, pathLength: "100" }));
      } else if (kind === "double") {
        g.append(s("path.mark-line", { d: ring(0, 0, 19, 1.08), pathLength: "100" }), s("path.mark-line.late", { d: ring(0, 0, 11, 1.05), pathLength: "100" }));
      } else if (kind === "single") {
        g.append(s("path.mark-line", { d: ring(0, 0, 18, 1.1), pathLength: "100" }));
      } else {
        g.append(s("path.mark-line", { d: "M0,-17 L17,12 L-17,12 Z", pathLength: "100" }));
      }
      g.append(s("text.mark-score", { x: 0, y: 46, "text-anchor": "middle", transform: "rotate(-8 0 46)" }, `${score}点`));
      this.marks.append(g);
    }

    hanko(kanji) {
      // A vermilion seal pressed into the lower-left corner, slightly uneven.
      const g = s("g.hanko", { transform: "translate(17 92) rotate(-5)" });
      const fid = `${this.id}-rough`;
      g.append(
        s("defs", s("filter", { id: fid, x: "-20%", y: "-20%", width: "140%", height: "140%" },
          s("feTurbulence", { type: "fractalNoise", baseFrequency: "0.35", numOctaves: "2", seed: String(this.ch.codePointAt(0) % 97), result: "n" }),
          s("feDisplacementMap", { in: "SourceGraphic", in2: "n", scale: "1.3" }))),
        s("g", { filter: `url(#${fid})` },
          s("rect", { x: -11, y: -11, width: 22, height: 22, rx: 2.5 }),
          s("rect.inner", { x: -9, y: -9, width: 18, height: 18, rx: 1.2 }),
          s("text", { "text-anchor": "middle", dy: kanji.length > 1 ? "2.4" : "5", class: kanji.length > 1 ? "small" : "" }, kanji))
      );
      this.marks.append(g);
    }

    neonSign(word, score) {
      const g = s("g.neon-sign", { style: `--c:${this.color}` });
      g.append(
        s("rect", { x: 8, y: 92, width: 93, height: 13, rx: 6.5 }),
        s("text", { x: 54.5, y: 101.6, "text-anchor": "middle" }, `${word} · ${score}`)
      );
      this.marks.append(g);
    }

    badge(at, acc) {
      const b = h("div.badge", { class: acc >= 90 ? "great" : acc >= 75 ? "good" : "meh", style: { left: `${at.x}px`, top: `${at.y}px` } }, `${acc}%`);
      this.badges.append(b);
      setTimeout(() => b.remove(), 1600);
    }

    showRef(idx) {
      const p = s("path.ref-flash", { d: this.strokes[idx].d });
      this.marks.append(p);
      setTimeout(() => p.remove(), 1300);
    }

    // Shows where the flick should go: the model's last stretch, with an arrow.
    showHane(idx) {
      const st = this.strokes[idx];
      const tail = st.pts.slice(-8);
      const p = tail[tail.length - 1], q = tail[tail.length - 3];
      const ang = (Math.atan2(p.y - q.y, p.x - q.x) * 180) / Math.PI;
      const g = s("g.hane-flash",
        s("polyline", { points: tail.map((t) => `${t.x.toFixed(1)},${t.y.toFixed(1)}`).join(" ") }),
        s("path", { d: "M-3,-3 L1.5,0 L-3,3", transform: `translate(${p.x} ${p.y}) rotate(${ang})` }));
      this.marks.append(g);
      setTimeout(() => g.remove(), 1800);
    }

    // ── demo ───────────────────────────────────────────────
    /* Plays the stroke order with the current style's ink, then restores the
     * learner's own strokes. Speed rises and falls like a real hand, which is
     * what makes the brush swell and thin. */
    async demo() {
      if (this.demoToken) return;
      const token = (this.demoToken = {});
      const savedFinished = this.finished;
      this.marks.replaceChildren();
      this.hints.replaceChildren();
      const c = this.ink.getContext("2d");
      c.clearRect(0, 0, this.size, this.size);
      const w = this.w;
      if (this.style === "neon") this.strokes.forEach((st) => Ink.tube(c, st.raw.map((p) => this.toPx(p)), { w }));
      const lc = this.live.getContext("2d");
      for (let i = 0; i < this.strokes.length; i++) {
        if (this.demoToken !== token) return;
        const st = this.strokes[i];
        const pts = timed(Geo.resample(st.raw, Math.max(12, Math.round(st.len * 0.9))).map((p) => this.toPx(p)), st.len, st.hane);
        Audio.drawStart(this.style);
        const t0 = performance.now();
        const dur = pts[pts.length - 1].t - pts[0].t;
        await new Promise((res) => {
          const step = (now) => {
            if (this.demoToken !== token) { Audio.drawEnd(); return res(); }
            const el = now - t0;
            const upto = pts.filter((p) => p.t - pts[0].t <= el);
            lc.clearRect(0, 0, this.size, this.size);
            if (upto.length) this.paint(lc, upto, true);
            const k = upto.length;
            if (k > 3) Audio.drawMove(Math.hypot(upto[k - 1].x - upto[k - 3].x, upto[k - 1].y - upto[k - 3].y) / Math.max(8, upto[k - 1].t - upto[k - 3].t) * (360 / this.size) / 1.6);
            if (el < dur) requestAnimationFrame(step);
            else res();
          };
          requestAnimationFrame(step);
        });
        Audio.drawEnd();
        if (this.demoToken !== token) return;
        lc.clearRect(0, 0, this.size, this.size);
        if (this.style === "neon") Ink.neon(c, pts, { w, color: NEON[(this.colorIndex + i) % NEON.length] });
        else this.paint(c, pts, false);
        Audio.accept(this.style, i, this.strokes.length);
        await wait(260);
      }
      await wait(900);
      if (this.demoToken !== token) return;
      this.demoToken = null;
      this.finished = savedFinished;
      this.renderInk();
      this.drawHints();
      if (this.finished) this.finish(true);
      this.onEvent({ type: "demo-end" });
    }

    stopDemo() {
      if (!this.demoToken) return;
      this.demoToken = null;
      Audio.drawEnd();
      this.live.getContext("2d").clearRect(0, 0, this.size, this.size);
      this.renderInk();
      this.drawHints();
    }

    // ── particles ──────────────────────────────────────────
    origin() {
      const r = this.host.getBoundingClientRect();
      return { x: r.left, y: r.top };
    }

    penFx(p, v) {
      if (this.style !== "neon" || NH.reducedMotion()) return;
      const now = performance.now();
      if (now - this.lastFx < 40) return;
      this.lastFx = now;
      const o = this.origin();
      for (let i = 0; i < 2; i++) {
        this.particles.push({ kind: "spark", x: o.x + p.x, y: o.y + p.y, vx: rand(-1, 1) * 1.5, vy: rand(-1.5, 0.5), life: 1, decay: rand(0.03, 0.06), color: this.color, size: rand(1, 2.2) });
      }
      this.runFx();
    }

    sparks(pts, color, n) {
      if (NH.reducedMotion()) return;
      const o = this.origin();
      for (let i = 0; i < n; i++) {
        const p = pts[(Math.random() * pts.length) | 0];
        const a = rand(0, Math.PI * 2), sp = rand(1, 4.5);
        this.particles.push({ kind: "spark", x: o.x + p.x, y: o.y + p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 1, decay: rand(0.015, 0.035), color, size: rand(1, 2.6) });
      }
      this.runFx();
    }

    splatter(p, ang, v) {
      if (NH.reducedMotion()) return;
      const o = this.origin();
      const n = Math.min(9, 3 + Math.round(v * 2));
      for (let i = 0; i < n; i++) {
        const a = ang + rand(-0.35, 0.35), sp = rand(2, 6) * Math.min(1.6, v / 1.4);
        this.particles.push({ kind: "ink", x: o.x + p.x, y: o.y + p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.006, drag: 0.82, color: "#16120f", size: rand(0.8, 2.6) * (this.size / 360) });
      }
      this.runFx();
    }

    petals(n) {
      if (NH.reducedMotion()) return;
      for (let i = 0; i < n; i++) {
        this.particles.push({ kind: "petal", x: rand(-40, innerWidth * 0.6), y: rand(-80, -10), vx: rand(0.8, 2.2), vy: rand(0.8, 1.8), life: 1, decay: 0.0035, rot: rand(0, 6.28), vr: rand(-0.05, 0.05), size: rand(5, 9), sway: rand(0, 6.28) });
      }
      this.runFx();
    }

    dust(pts) {
      if (NH.reducedMotion()) return;
      const o = this.origin();
      for (let i = 0; i < 14; i++) {
        const p = pts[(Math.random() * pts.length) | 0];
        this.particles.push({ kind: "dust", x: o.x + p.x, y: o.y + p.y, vx: rand(-1, 1), vy: rand(-0.5, 1.5), life: 1, decay: rand(0.02, 0.04), color: "#8a8478", size: rand(1, 2.4) });
      }
      this.runFx();
    }

    runFx() {
      if (this.fxRunning) return;
      this.fxRunning = true;
      const ctx = this.fx.getContext("2d");
      const tick = () => {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        this.particles = this.particles.filter((q) => (q.life -= q.decay) > 0);
        for (const q of this.particles) {
          if (q.kind === "spark") {
            q.vy += 0.08; q.vx *= 0.97;
            // A soft wide streak under a bright thin one reads as a glowing spark.
            ctx.globalCompositeOperation = "lighter";
            ctx.strokeStyle = q.color;
            ctx.lineCap = "round";
            const x0 = q.x, y0 = q.y;
            q.x += q.vx; q.y += q.vy;
            for (const [width, alpha] of [[q.size * 4, 0.18], [q.size, 1]]) {
              ctx.globalAlpha = q.life * alpha;
              ctx.lineWidth = width;
              ctx.beginPath();
              ctx.moveTo(x0, y0);
              ctx.lineTo(q.x, q.y);
              ctx.stroke();
            }
          } else if (q.kind === "ink") {
            q.vx *= q.drag; q.vy *= q.drag;
            q.x += q.vx; q.y += q.vy;
            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = Math.min(1, q.life * 1.5) * 0.9;
            ctx.fillStyle = q.color;
            ctx.beginPath();
            ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2);
            ctx.fill();
          } else if (q.kind === "petal") {
            q.sway += 0.04;
            q.x += q.vx + Math.sin(q.sway) * 0.8; q.y += q.vy; q.rot += q.vr;
            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = Math.min(1, q.life * 2) * 0.85;
            ctx.save();
            ctx.translate(q.x, q.y);
            ctx.rotate(q.rot);
            ctx.scale(1, 0.6 + 0.4 * Math.sin(q.sway * 2));
            ctx.fillStyle = "#f4b6c2";
            ctx.beginPath();
            ctx.ellipse(0, 0, q.size, q.size * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          } else {
            q.vy += 0.1;
            q.x += q.vx; q.y += q.vy;
            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = q.life;
            ctx.fillStyle = q.color;
            ctx.fillRect(q.x, q.y, q.size, q.size);
          }
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        if (this.particles.length) this.fxRaf = requestAnimationFrame(tick);
        else { this.fxRunning = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
      };
      this.fxRaf = requestAnimationFrame(tick);
    }
  }

  // A hand-drawn ring that overshoots its start a little, like a teacher's red pen.
  function ring(cx, cy, r, turns) {
    let d = "";
    for (let a = 0; a <= Math.PI * 2 * turns; a += 0.1) {
      const rr = r * (1 + 0.04 * Math.sin(a * 1.5));
      d += `${d ? "L" : "M"}${(cx + Math.cos(a - 2) * rr).toFixed(2)},${(cy + Math.sin(a - 2) * rr * 0.92).toFixed(2)}`;
    }
    return d;
  }

  // Gives demo points timestamps: ease in, cruise, ease out.
  function timed(pts, len, hane = false) {
    const dur = 160 + len * 3.4;
    const n = pts.length;
    const out = pts.map((p, i) => {
      const u = i / (n - 1);
      const e = 0.6 * u * u * (3 - 2 * u) + 0.4 * u; // press in, sweep, settle
      return { ...p, t: e * dur, p: 0 };
    });
    if (hane) {
      // Flick the last stretch quickly, so the brush tapers into the hook.
      const k = Math.floor(n * 0.86), t0 = out[k].t;
      for (let i = k + 1; i < n; i++) out[i].t = t0 + (out[i].t - t0) * 0.3;
    }
    return out;
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  NH.Writer = Writer;
  NH.GRADES = GRADES;
  NH.NEON = NEON;
})();

/* js/app.js */
/* Screens and routing. Routes live in the hash (#hiragana, #k-3042, #w-3042,
 * #word-mizu …) so Android's back button and bookmarks work. */
window.NH = window.NH || {};

(function () {
  const { h, s, store, Audio, TTS, Backdrop, hex, unhex, shuffle } = NH;
  const app = document.getElementById("app");
  let cleanup = [];

  // ── icons (inline vector) ────────────────────────────────
  const ICONS = {

  // ── explain ──────────────────────────────────────────────
  function explain(ch) {
    document.body.classList.add("scr-explain");

    const prev = NH.ORDER[idx - 1], next = NH.ORDER[idx + 1];

    const parts = isCombo ? [...ch] : I.base ? [I.base, I.mark === "handakuten" ? "゜" : I.mark === "dakuten" ? "゛" : "small"] : null;

        iconBtn("back", "All hiragana", () => go("hiragana")),
        h("h1.bar-title", h("b", ch), h("small", romaji(ch))),
        iconBtn("gear", "Settings", settings)),
      h("nav.modes", { "aria-label": "Mode" }, h("a.mode.on", { href: `#k-${hex(ch)}`, "aria-current": "page" }, icon("book"), "Explain"), h("a.mode", { href: `#w-${hex(ch)}` }, icon("pen"), "Write")),

  // Which strokes end in a hane (flick), from the stroke data.
  function haneNotes(ch) {
    return [...ch].flatMap((c) => {
      const ns = NH.Geo.strokesOf(c).map((st, i) => (st.hane ? i + 1 : 0)).filter(Boolean);
      if (!ns.length) return [];
      const which = ns.length === 1 ? `Stroke ${ns[0]}` : `Strokes ${ns.join(" and ")}`;
      return [`${[...ch].length > 1 ? c + ": " : ""}${which} end${ns.length === 1 ? "s" : ""} with a hane (跳ね), a quick flick up and away as you lift the pen. It's marked with a red arrow above.`];
    });
  }

  function comboNotes(ch) {
    const [a, b] = [...ch];

      `Write the small ${b} about half size, sitting in the lower left of its square.`,

  }

  function examplesCard(ch, I) {
    let ex = (I.examples || []).slice();

    for (const w of NH.WORDS) if (ex.length < 4 && w.kana.includes(ch) && !ex.some((e) => e.w === w.kana)) ex.push({ w: w.kana, r: w.romaji, m: w.meaning, id: w.id });

  function highlight(word, ch) {

  const strokeCount = (ch) => [...ch].reduce((n, c) => n + (NH.STROKES[c] || []).length, 0);

  // Stroke order diagram: strokes draw themselves in order, numbered.
  function strokeOrderSvg(ch) {
    const cs = [...ch];
    const W = 109 * cs.length;
    const svg = s("svg.so", { viewBox: `0 0 ${W} 109`, role: "img", "aria-label": `Stroke order of ${ch}` });
    svg.append(s("g.so-grid", s("rect", { x: 1, y: 1, width: W - 2, height: 107, rx: 6 }), ...cs.map((_, i) => [s("line", { x1: i * 109 + 54.5, y1: 4, x2: i * 109 + 54.5, y2: 105 }), s("line", { x1: i * 109 + 4, y1: 54.5, x2: i * 109 + 105, y2: 54.5 })]).flat()));
    let n = 0;
    cs.forEach((c, ci) => {
      const I = info(c);
      const baseCount = I.base && NH.STROKES[I.base] ? NH.STROKES[I.base].length : Infinity;
      const g = s("g", { transform: `translate(${ci * 109} 0)` });

        g.append(s("path.so-bg", { d: st.d }));
        g.append(s("path.so-st", { d: st.d, pathLength: "1", class: i >= baseCount ? "mark" : "", style: `--i:${n}` }));

        }
        n++;

      svg.append(g);
    });

  }

  function replay(svg) {
    svg.classList.remove("play");
