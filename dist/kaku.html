    const n = pts.length;
    const out = pts.map((p, i) => {
      const u = i / (n - 1);
      const e = 0.6 * u * u * (3 - 2 * u) + 0.4 * u; // press in, sweep, settle
      return { ...p, t: e * dur, p: 0 };
    });
    if (hane) {
      // Flick the last stretch quickly, so the brush tapers into the hook.
      const k = Math.floor(n * 0.86), t0 = out[k].t;
      for (let i = k + 1; i < n; i++) out[i].t = t0 + (out[i].t - t0) * 0.3;
    }
    return out;
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  NH.Writer = Writer;
  NH.GRADES = GRADES;
  NH.NEON = NEON;
})();

/* js/today.js */
/* Today: the spaced-repetition queue, the sessions that work through it, the
 * "hear it, write it" drill, and the progress-by-row view. Nothing here counts
 * streaks or points; the only number that matters is what's due. */
window.NH = window.NH || {};

(function () {
  const { h, store, SRS, Backdrop, hex, shuffle } = NH;
  const UI = NH.UI;

  // ── Today tab ────────────────────────────────────────────
  const LEARN = [["hiragana", "Hiragana first"], ["katakana", "Katakana first"], ["both", "Both together"]];

  NH.Tabs.today = function (body, S = NH.SCRIPTS.hiragana) {
    const { due, fresh } = SRS.today();
    const here = UI.tabRoute("today", S);
    const prefix = S.id === "hiragana" ? "" : `${S.id}-`;
    const isKanji = S.id === "kanji";
    const total = due.length + fresh.length;
    const preview = [...due, ...fresh].slice(0, 12).map((id) => SRS.itemText(id));
    const limit = store.settings.dailyNew ?? 5;
    const limits = h("div.chips", { role: "radiogroup", "aria-label": "New kana per day" }, [3, 5, 10].map((n) =>
      h("button.chip", { type: "button", role: "radio", "aria-checked": String(n === limit), onclick: () => { store.set("dailyNew", n); UI.go(here); } }, `${n} a day`)));
    const mode = store.settings.learn || "hiragana";
    const order = h("div.chips", { role: "radiogroup", "aria-label": "Which kana to learn first" }, LEARN.map(([id, label]) =>
      h("button.chip", { type: "button", role: "radio", "aria-checked": String(id === mode), onclick: () => { store.set("learn", id); UI.go(here); } }, label)));
    // On the katakana line, say why no katakana are coming yet.
    const waiting = S.id === "katakana" && mode === "hiragana" && SRS.kanaOrder("hiragana").some((c) => !SRS.card("k:" + c));
    const kanjiLimit = store.settings.dailyKanji ?? 2;
    const kanjiLimits = h("div.chips", { role: "radiogroup", "aria-label": "New kanji per day" }, [[0, "Off"], [2, "2 a day"], [3, "3 a day"], [5, "5 a day"]].map(([n, label]) =>
      h("button.chip", { type: "button", role: "radio", "aria-checked": String(n === kanjiLimit), onclick: () => { store.set("dailyKanji", n); UI.go(here); } }, label)));
    const kanjiWaiting = isKanji && !SRS.ready("j:" + NH.KANJI[0].k);

    body.append(
      h("section.card.today-card",
        h("h2", "Today"),
        total
          ? h("p.today-sum", h("b", `${due.length}`), ` to review · `, h("b", `${fresh.length}`), ` new`)
          : h("p.today-sum", "All caught up. ", nextDueText()),
        preview.length ? h("p.today-preview", { "aria-label": "Coming up" }, preview.map((t) => h("span", t))) : null,
        total ? UI.btn("Start", () => UI.go(prefix + "session"), "primary", "play") : null,
        isKanji ? h("div.today-limit", h("span.muted", "New kanji:"), kanjiLimits) : h("div.today-limit", h("span.muted", "New kana:"), limits),
        isKanji ? null : h("div.today-limit", h("span.muted", "Learn:"), order),
        waiting ? h("p.muted.today-note", "New kana come from hiragana until you've started all of it. Pick Katakana first or Both together to begin katakana now.") : null,
        kanjiWaiting ? h("p.muted.today-note", "Kanji start once you've started all 46 basic hiragana, since their readings are written in kana.") : null),
      ...(isKanji ? [] : [h("section.card.today-card",
        h("h2", "Hear it, write it"),
        h("p", "Ten kana read aloud, no picture. Write each one from memory."),
        UI.btn("Start dictation", () => UI.go(prefix + "dictation"), "ghost", "ear"))]),
      isKanji ? kanjiProgress() : progressByRow(S));
  };

  function nextDueText() {
    const now = Date.now();
    const next = Object.values(store.srs().cards).map((c) => c.due).filter((t) => t > now).sort((a, b) => a - b)[0];
    if (!next) return "Start with the first kana whenever you like.";
    const hrs = (next - now) / 3600e3;
    return `Next review ${hrs < 1 ? "within the hour" : hrs < 20 ? `in about ${Math.round(hrs)} hours` : hrs < 44 ? "tomorrow" : `in ${Math.round(hrs / 24)} days`}.`;
  }

  // Each kana as a chip coloured by how well it's held; tap one to study it.
  function progressByRow(S) {
    const label = { new: "not started", learning: "learning", due: "due now", strong: "strong" };
    const chip = (c) => {
      const st = SRS.strength("k:" + c);
      return h("a.pchip", { href: `#k-${hex(c)}`, class: "s-" + st, title: `${c} ${UI.romaji(c)}: ${label[st]}`, "aria-label": `${c}, ${label[st]}` }, c);
    };
    const table = (key) => h("div.ptable", S.tables[key].rows.map((row) => {
      const cells = row.cells.filter(Boolean);
      return h("div.prow", h("span.prow-name", `${cells[0]}-row`), h("span.prow-chips", cells.map(chip)));
    }));
    const summary = (key, name) => {
      const counts = { new: 0, learning: 0, due: 0, strong: 0 };
      S.tables[key].rows.flatMap((r) => r.cells).filter(Boolean).forEach((c) => counts[SRS.strength("k:" + c)]++);
      return h("p.muted", `${name}: ${counts.strong} strong, ${counts.learning + counts.due} learning, ${counts.new} not started.`);
    };
    return h("section.card.progress",
      h("h2", `${S.en} by row`),
      h("p.legend", Object.entries(label).map(([k, v]) => h("span", h("i", { class: "s-" + k }), v))),
      h("h3.muted", "Gojūon"), table("basic"),
      S.id === "katakana" ? h("div.prow", h("span.prow-name", "long"), h("span.prow-chips", chip("ー"))) : null,
      h("h3.muted", "Dakuten & handakuten"), table("voiced"),
      summary("combos", "Combos"),
      S.tables.extended ? summary("extended", "Loanword sounds") : null);
  }

  // The 80 kanji in their theme groups, coloured like the kana rows.
  function kanjiProgress() {
    return h("section.card.progress",
      h("h2", "Kanji by theme"),
      h("div.ptable", NH.Kanji.GROUPS.map(([g, , en]) => h("div.prow", h("span.prow-name", en),
        h("span.prow-chips", NH.KANJI.filter((x) => x.group === g).map((x) => {
          const st = SRS.strength("j:" + x.k);
          return h("a.pchip", { href: `#k-${hex(x.k)}`, class: "s-" + st, title: `${x.k} ${x.meaning}`, "aria-label": `${x.k}, ${st === "new" ? "not started" : st === "due" ? "due now" : st}` }, x.k);
        }))))));
  }

  // ── sessions ─────────────────────────────────────────────
  // #session and #dictation; #katakana-session… come back to their own line.
  const backOf = (m) => (m[1] ? `${m[1]}today` : "today");
  NH.Routes.push({ match: /^(katakana-|kanji-)?session$/, render: (m) => runSession(todayTasks(), { title: "今日 Today", back: backOf(m) }) });
  NH.Routes.push({ match: /^(katakana-)?dictation$/, render: (m) => runSession(dictationTasks(m[1] ? "katakana" : "hiragana"), { title: "Hear it, write it", back: backOf(m), practiceOnly: true }) });

  function todayTasks() {
    const { due, fresh } = SRS.today();
    return [...due.slice(0, 40).map((id) => ({ id, type: reviewType(id) })), ...fresh.map((id) => ({ id, type: "intro" }))];
  }
  // Kana rotate through writing, recognising and dictation; words between writing and recognising.
  function reviewType(id) {
    const n = SRS.card(id)?.reps || 0;
    if (id[0] === "r") return "read";
    if (id === "k:ー") return "write"; // a mark has no sound of its own to hear or name
    if (id[0] === "k") return ["write", "recognize", "hear"][n % 3];
    return ["write", "recognize"][n % 2];
  }
  // Dictation draws on the kana you've started, weakest first; a beginner gets the first rows.
  function dictationTasks(script = "hiragana") {
    const now = Date.now();
    let pool = Object.entries(store.srs().cards).filter(([id]) => id.startsWith("k:") && [...id.slice(2)].length === 1 && id !== "k:ー" && NH.scriptOf(id.slice(2)).id === script)
      .sort((a, b) => SRS.retrievability((now - a[1].last) / SRS.DAY, a[1].s) - SRS.retrievability((now - b[1].last) / SRS.DAY, b[1].s))
      .map(([id]) => id);
    if (pool.length < 5) pool = SRS.kanaOrder(script).slice(0, 10).map((c) => "k:" + c);
    return shuffle(pool.slice(0, 10)).map((id) => ({ id, type: "hear" }));
  }

  function runSession(tasks, { title, back, practiceOnly = false }) {
    const app = document.getElementById("app");
    const st = store.settings;
    const style = st.style;
    let i = 0, writer = null, alive = true, reviewed = 0, introduced = 0;
    const retried = new Set();
    const timers = [];
    const later = (fn, ms) => timers.push(setTimeout(() => alive && fn(), ms));
    UI.onLeave(() => { alive = false; timers.forEach(clearTimeout); writer?.destroy(); });

    document.body.classList.add("scr-write");
    document.body.dataset.style = style;
    const stage = h("main.stage.session", { "data-style": style, "data-hand": st.hand || "right" });
    const backdrop = h("div.backdrop");
    const progress = h("span.session-count");
    const panel = h("div.panel");
    const cellWrap = h("div.cell-wrap");
    stage.append(backdrop,
      h("header.bar.stage-bar", UI.iconBtn("back", "Leave", () => UI.go(back)), h("h1.bar-title", h("b", title), h("small", progress)), UI.iconBtn("gear", "Settings", () => UI.settings())),
      panel, cellWrap);
    app.replaceChildren(stage);
    Backdrop.render(backdrop, style, [], 7);
    UI.syncBars();

    function next() {
      writer?.destroy();
      writer = null;
      panel.replaceChildren();
      cellWrap.replaceChildren();
      if (i >= tasks.length) return finish();
      progress.textContent = `${i + 1} of ${tasks.length}`;
      const t = tasks[i];
      const render = RENDER[t.type];
      if (!render || !SRS.itemText(t.id)) { i++; return next(); }
      render(t, (grade) => {
        if (practiceOnly) SRS.practice(t.id, grade);
        else {
          if (!SRS.card(t.id)) introduced++;
          else reviewed++;
          SRS.review(t.id, grade);
        }
        // Forgotten items come round once more before the session ends.
        if (grade === SRS.AGAIN && !retried.has(t.id)) {
          retried.add(t.id);
          tasks.push({ id: t.id, type: t.type === "intro" ? "write" : t.type });
        }
        i++;
        next();
      });
    }

    // ── task types ──
    const RENDER = { intro, write: (t, done) => writeTask(t, done, "memory"), hear: (t, done) => writeTask(t, done, "memory", true), recognize, read: (t, done) => NH.ReadTask(t, { panel, cellWrap, later, finish: finishTask, style }, done) };

    function prompt(label, main, sub, speakText) {
      return h("div.task-prompt",
        h("span.task-label", label),
        main ? h("div.task-main", main) : null,
        sub ? h("div.task-sub", sub) : null,
        speakText ? UI.speakBtn(speakText) : null);
    }

    function intro(t, done) {
      if (t.id[0] === "r") return RENDER.read(t, done);
      const d = describe(t.id);
      const svg = UI.strokeOrderSvg(d.text);
      panel.append(
        prompt(d.label, d.big, d.intro, d.speak),
        d.note ? h("p.task-note", d.note) : null,
        h("div.actions", UI.btn("Write it", () => writeTask(t, done, d.single ? "trace" : "guide"), "primary", "pen")));
      cellWrap.append(h("div.so-wrap.task-so", svg, h("div.so-tools", UI.iconBtn("play", "Replay stroke order", () => UI.replay(svg)))));
      requestAnimationFrame(() => UI.replay(svg));
      UI.say(d.speak, { quiet: true });
    }

    function writeTask(t, done, assist, hearOnly = false) {
      panel.replaceChildren();
      cellWrap.replaceChildren();
      const d = describe(t.id);
      const text = d.text;
      const chars = [...text];
      let pos = 0, scoreSum = 0, misses = 0, hinted = false;
      const fb = h("p.feedback", { "aria-live": "polite" });
      const seq = chars.length > 1 ? h("div.seq") : null;
      const drawSeq = () => seq?.replaceChildren(...chars.map((c, k) =>
        h("span.seq-c", { class: [k === pos ? "on" : "", k < pos ? "done" : ""].join(" ") }, h("span", k < pos ? c : "?"))));
      const main = hearOnly ? null : d.cue;
      const sub = hearOnly ? null : d.cueSub;
      panel.append(
        prompt(hearOnly ? "Hear it, write it" : assist === "memory" ? "Write it from memory" : "Write it", main, sub, null),
        h("div.actions",
          UI.btn("Listen", () => UI.say(d.speak), "ghost", "speaker"),
          UI.btn("Show me", () => { hinted = true; writer.demo(); }, "ghost", "play")),
        seq, fb);
      const cell = h("div.cell");
      cellWrap.append(cell);
      writer = new NH.Writer(cell, { style, assist, onEvent });
      writer.setChar(chars[0], 0);
      drawSeq();
      fb.textContent = hearOnly ? "Listen, then write what you hear." : `${chars.length > 1 ? `${chars.length} characters. ` : ""}${assist === "memory" ? "Start whenever you're ready." : "Follow the guide."}`;
      later(() => UI.say(d.speak, { quiet: true }), 250);

      function onEvent(e) {
        if (e.type === "stroke" && !e.ok) { fb.textContent = e.message; fb.className = "feedback no"; }
        if (e.type === "stroke" && e.ok) { fb.textContent = `Stroke ${e.index + 1} ✓`; fb.className = "feedback ok"; }
        if (e.type !== "done") return;
        scoreSum += e.score;
        misses += e.misses;
        pos++;
        drawSeq();
        if (pos < chars.length) return later(() => writer.setChar(chars[pos], pos), 900);
        const score = Math.round(scoreSum / chars.length);
        let grade = SRS.gradeWriting({ score, misses, assist });
        if (hinted) grade = Math.min(grade, SRS.HARD);
        // Tracing caps the grade, but a clean trace still counts as a pass.
        const pass = score >= 75 && misses < 3;
        fb.className = pass ? "feedback ok" : "feedback tip";
        fb.textContent = `${text} (${d.reading}) · ${score}%${hinted ? " · with a hint" : ""}`;
        UI.say(d.speak, { quiet: true });
        finishTask(grade, done, pass);
      }
    }

    function recognize(t, done) {
      const d = describe(t.id);
      const text = d.text;
      const kind = t.id[0], isKana = kind === "k";
      const item = itemOf(t.id);
      const answer = isKana ? UI.romaji(text) : item.meaning;
      const pool = isKana
        ? SRS.kanaOrder(NH.scriptOf(text).id).filter((c) => [...c].length === [...text].length && UI.romaji(c) !== answer)
        : kind === "j" ? NH.KANJI : kind === "v" ? NH.KANJI_WORDS : [...NH.WORDS, ...NH.PHRASES];
      const looks = isKana ? (UI.info(text).lookalikes || []).filter((c) => UI.romaji(c) !== answer)
        : kind === "j" ? item.lookalikes.map((c) => NH.KANJI_INFO[c]) : [];
      const wrong = [...new Set([...shuffle(looks), ...shuffle(pool)].map((x) => (isKana ? UI.romaji(x) : x.meaning)))].filter((x) => x !== answer).slice(0, 3);
      const options = shuffle([answer, ...wrong]);
      const shownAt = performance.now();
      const fb = h("p.feedback", { "aria-live": "polite" });
      panel.append(prompt(isKana ? "How do you read this?" : "What does this mean?", null, null, null), fb);
      const opts = h("div.qopts", { class: "latin" }, options.map((o) => h("button.qopt", { type: "button", onclick: (e) => choose(o, e.currentTarget) }, o)));
      cellWrap.append(h("div.task-card", h("div.qprompt", { class: chars1(text) ? "" : "word" }, text), opts));
      function choose(o, el) {
        if (opts.dataset.answered) return;
        opts.dataset.answered = "1";
        const ok = o === answer;
        opts.querySelectorAll("button").forEach((b) => { b.disabled = true; if (b.textContent === answer) b.classList.add("right"); else if (b === el) b.classList.add("wrong"); });
        ok ? NH.Audio.accept(style, 3, 5) : NH.Audio.reject(style);
        fb.className = ok ? "feedback ok" : "feedback no";
        fb.textContent = ok ? `Yes: ${text} is ${answer}.` : `${text} is ${answer}.`;
        UI.announce(fb.textContent);
        UI.say(d.speak, { quiet: true });
        finishTask(SRS.gradeChoice(ok, performance.now() - shownAt), done);
      }
    }

    // Good answers move on by themselves; otherwise wait so there's time to look.
    function finishTask(grade, done, pass = grade >= SRS.GOOD) {
      if (pass) return later(() => done(grade), 1300);
      panel.append(h("div.actions", UI.btn("Next", () => done(grade), "primary", "next")));
      panel.querySelector(".actions:last-child button")?.focus();
    }

    function finish() {
      progress.textContent = "";
      const now = Date.now();
      const upcoming = Object.values(store.srs().cards).filter((c) => c.due > now).sort((a, b) => a.due - b.due);
      panel.append(prompt(practiceOnly ? "Dictation done" : "That's today's practice", null, null, null));
      cellWrap.append(h("div.task-card.summary",
        practiceOnly ? h("p", `${tasks.length} kana written from sound.`) : h("p", h("b", reviewed), " reviewed · ", h("b", introduced), " new"),
        upcoming.length ? h("p.muted", nextDueText()) : null,
        h("div.result-actions", UI.btn("Back to Today", () => UI.go(back), "primary", "next"))));
      NH.Audio.complete(style, 100);
    }

    next();
  }

  function itemOf(id) {
    const key = id.slice(2);
    if (id[0] === "w") return NH.WORDS.find((w) => w.id === key);
    if (id[0] === "p") return NH.PHRASES.find((w) => w.id === key);
    if (id[0] === "r") return (NH.READING || []).find((r) => r.id === key);
    if (id[0] === "v") return (NH.KANJI_WORDS || []).find((w) => w.id === key);
    if (id[0] === "j") return NH.KANJI_INFO?.[key];
    return null;
  }
  const chars1 = (t) => [...t].length === 1;

  /* How a card is shown: its text, what to show when introducing it, the cue
   * for writing it from memory, and what to say aloud. */
  function describe(id) {
    const kind = id[0], text = SRS.itemText(id), item = itemOf(id);
    if (kind === "k") {
      const I = UI.info(text);
      return { text, single: true, label: "New kana", big: text, intro: UI.romaji(text), cue: UI.romaji(text), reading: UI.romaji(text), speak: text, note: I.mnemonic || I.notes?.[0] };
    }
    if (kind === "j") {
      const readings = [...item.on, ...item.kun.map((k) => k.replace(".", ""))].join("・");
      return { text, single: true, label: "New kanji", big: text, intro: `${item.meaning} · ${readings}`, cue: item.meaning, cueSub: readings, reading: item.meaning, speak: text, note: item.mnemonic };
    }
    if (kind === "v") {
      return { text, label: "New word", big: UI.ruby(text, item.kana), intro: `${item.kana} · ${item.meaning}`, cue: item.meaning, cueSub: item.kana, reading: `${item.kana} · ${item.meaning}`, speak: item.kana, note: item.note };
    }
    return { text, label: kind === "w" ? "New word" : "New phrase", big: text, intro: `${item.romaji} · ${item.meaning}`, cue: item.meaning, cueSub: item.romaji, reading: `${item.romaji} · ${item.meaning}`, speak: text, note: item.note };
  }

  NH.Today = { todayTasks, dictationTasks, reviewType, itemOf, describe, runSession };
})();

/* js/read.js */
/* Reading mode: signs, menus and short sentences drawn the way you'd meet them
 * in Japan. Tap any kana for its sound; the reading and meaning stay hidden
 * until you ask, so you get to try first. */
window.NH = window.NH || {};

(function () {
  const { h, hex, shuffle } = NH;
  const UI = NH.UI;
  const COMBINE = new Set(["ゃ", "ゅ", "ょ", "ぁ", "ぃ", "ぅ", "ぇ", "ぉ", "ャ", "ュ", "ョ", "ァ", "ィ", "ゥ", "ェ", "ォ"]);
  const KINDS = [
    ["station", "駅", "Stations", "Name boards on the platform, with the stops either side."],
    ["sign", "看板", "Signs", "Curtains, road markings and notices around town."],
    ["menu", "食べ物", "Food", "Sushi menus, noodle shops, stalls and convenience-store labels."],
    ["sentence", "文", "Sentences", "Short sentences with a space between words, as in children's books."],
  ];

  const byId = (id) => NH.READING.find((r) => r.id === id);
  // Signs with any katakana live on the katakana line; the rest are hiragana.
  const itemsOf = (S) => NH.READING.filter((r) => NH.scriptOf(r.kana) === S);

  /* Splits text into readable units: a kana plus any small ゃ/ゅ/ょ after it,
   * so きょ is one tap. Spaces separate words; punctuation is kept. */
  function units(text) {
    return text.split(/\s+/).filter(Boolean).map((word) => {
      const out = [];
      for (const c of word) {
        if (COMBINE.has(c) && out.length && NH.KANA_RE.test(out[out.length - 1])) out[out.length - 1] += c;
        else out.push(c);
      }
      return out;
    });
  }

  function unitReading(u, { last = false, sentence = false } = {}) {
    if (u === "っ" || u === "ッ") return "small tsu: a short pause that doubles the next sound";
    if (u === "ー") return "long-vowel mark: stretch the sound before it";
    if (!NH.KANA_RE.test(u)) return u === "。" ? "full stop" : u === "、" ? "comma" : u;
    if (sentence && last && u === "は") return "ha, read wa when it's a particle";
    if (u === "を" || u === "ヲ") return "o (written wo, said o)";
    return UI.romaji(u);
  }

  // The sign itself, drawn in CSS. `reveal` shows the romaji under it.
  function sign(item, { reveal = false, mini = false } = {}) {
    const cls = `sign look-${item.look}${mini ? " mini" : ""}`;
    const romaji = h("figcaption.sign-romaji", { hidden: !reveal }, item.romaji);
    let art;
    if (item.look === "station") {
      art = h("div.eki.eki-sign", { style: `--line:${item.line || "var(--line-h)"};--line-ink:${item.lineInk || "#0f1a07"}` },
        item.kanji ? h("div.eki-kanji", item.kanji) : null,
        h("div.eki-name", item.kana),
        h("div.eki-band", h("span.prev", item.prev ? `← ${item.prev}` : ""), h("span.next", item.next ? `${item.next} →` : "")));
    } else if (item.look === "noren") {
      art = h("div.noren", h("span.noren-rod"), h("span.noren-cloth", h("span.noren-l"), h("span.noren-r")), h("span.noren-text", item.kana));
    } else if (item.look === "vend") {
      art = h("div.vend", { class: "tone-" + (item.tone || "cold") }, h("span.vend-can"), h("span.sign-text", item.kana), h("span.vend-price", "¥130"));
    } else if (item.look === "warning") {
      art = h("div.warning", h("span.warn-mark", { "aria-hidden": "true" }, "!"), h("span.sign-text", item.kana));
    } else {
      art = h("div.sign-art", h("span.sign-text", item.kana));
    }
    return h("figure", { class: cls }, art, romaji);
  }

  // ── Read tab ─────────────────────────────────────────────
  NH.Tabs.read = function (body, S = NH.SCRIPTS.hiragana) {
    body.append(
      h("p.intro", S.id === "katakana"
        ? "Katakana around you: menus, shop signs and station notices, often mixed with hiragana. Try reading each one before you peek."
        : "Things you'll see in Japan, in hiragana. Try reading each one before you peek."),
      h("div.cta-row.left", UI.btn("Practice reading", () => UI.go(S.id === "katakana" ? "katakana-readquiz" : "readquiz"), "primary", "play")));
    for (const [kind, jp, title, blurb] of KINDS) {
      const items = itemsOf(S).filter((r) => r.kind === kind);
      if (!items.length) continue;
      body.append(h("section.rsec",
        h("div.ksec-head", h("h2", title, h("span.jp", jp)), h("p", blurb)),
        h("div.rgrid", items.map((r) => h("a.rcard", { href: `#sign-${r.id}` },
          sign(r, { mini: true }),
          h("span.rmeta", h("b", r.meaning), h("span.wlv", { title: `Level ${r.level}` }, "●".repeat(r.level) + "○".repeat(3 - r.level))))))));
    }
  };

  // ── one sign, up close ───────────────────────────────────
  NH.Routes.push({ match: /^sign-([a-z0-9-]+)$/, render: (m) => {
    const item = byId(m[1]);
    if (!item) return UI.go("read");
    signView(item);
  } });

  function signView(item) {
    const app = document.getElementById("app");
    document.body.classList.add("scr-read");
    const text = item.kana.replace(/\s/g, "");
    const fig = sign(item, { reveal: false });
    const out = h("p.tk-out", { "aria-live": "polite" }, "Tap a kana to hear it.");
    const isSentence = item.kind === "sentence";
    const tapRow = h("div.tapkana", { role: "group", "aria-label": "Kana in this sign" }, units(item.kana).map((word) =>
      h("span.tk-word", word.map((u, k) => NH.KANA_RE.test(u)
        ? h("button.tk", { type: "button", onclick: (e) => {
            tapRow.querySelectorAll(".tk.on").forEach((b) => b.classList.remove("on"));
            e.currentTarget.classList.add("on");
            out.textContent = `${u}: ${unitReading(u, { last: k === word.length - 1 && word.length > 1, sentence: isSentence })}`;
            UI.say(u, { quiet: true });
          } }, u)
        : h("span.tk-punct", u)))));
    const answer = h("section.card.read-answer", { hidden: true },
      h("div.big-romaji", item.romaji),
      h("p.read-meaning", item.meaning),
      item.kanji ? h("p.muted", "Usually written ", h("b", item.kanji), item.look === "station" ? " on the board above the hiragana." : ".") : null,
      item.where ? h("p", h("b", "Where: "), item.where) : null,
      item.note ? h("p", item.note) : null);
    const revealBtn = UI.btn("Show reading", () => {
      const show = answer.hidden;
      answer.hidden = !show;
      fig.querySelector(".sign-romaji").hidden = !show;
      revealBtn.querySelector("span").textContent = show ? "Hide reading" : "Show reading";
      revealBtn.setAttribute("aria-expanded", String(show));
    }, "ghost", "book");
    revealBtn.setAttribute("aria-expanded", "false");

    const S = NH.scriptOf(item.kana);
    const list = itemsOf(S);
    const idx = list.indexOf(item);
    const prev = list[idx - 1], next = list[idx + 1];
    app.replaceChildren(
      h("header.bar",
        UI.iconBtn("back", "All reading", () => UI.go(UI.tabRoute("read", S))),
        h("h1.bar-title", h("b", "読む"), h("small", "Read")),
        UI.iconBtn("gear", "Settings", () => UI.settings())),
      h("main.readview",
        h("div.read-stage", fig),
        h("p.read-hint.muted", item.where || "Try reading it first."),
        tapRow, out,
        h("div.actions",
          UI.btn("Listen", () => UI.say(text), "ghost", "speaker"),
          revealBtn,
          NH.Speak?.button ? NH.Speak.button(item) : null),
        answer,
        h("nav.pager",
          prev ? h("a.pg", { href: `#sign-${prev.id}`, "aria-label": `Previous: ${prev.kana}` }, UI.icon("prev"), h("span", prev.kana.replace(/\s/g, ""))) : h("span"),
          next ? h("a.pg", { href: `#sign-${next.id}`, "aria-label": `Next: ${next.kana}` }, h("span", next.kana.replace(/\s/g, "")), UI.icon("next")) : h("span"))));
  }

  // ── practice: "what does this say?" ──────────────────────
  NH.Routes.push({ match: /^(katakana-)?readquiz$/, render: (m) => {
    const S = m[1] ? NH.SCRIPTS.katakana : NH.SCRIPTS.hiragana;
    // Signs whose kana you've started come first; the rest fill up to ten.
    const ids = itemsOf(S).map((r) => "r:" + r.id);
    const ready = shuffle(ids.filter((id) => NH.SRS.ready(id)));
    const rest = shuffle(ids.filter((id) => !NH.SRS.ready(id))).sort((a, b) => byId(a.slice(2)).level - byId(b.slice(2)).level);
    const tasks = [...ready, ...rest].slice(0, 10).map((id) => ({ id, type: "read" }));
    NH.Today.runSession(tasks, { title: "読む Read", back: UI.tabRoute("read", S), practiceOnly: true });
  } });

  // A session task: pick the meaning of a sign. Used by Today and by practice.
  NH.ReadTask = function (t, { panel, cellWrap, finish, style }, done) {
    const item = byId(t.id.slice(2));
    const isStation = item.kind === "station";
    const same = NH.READING.filter((r) => r !== item && r.kind === item.kind);
    const other = NH.READING.filter((r) => r !== item && r.kind !== item.kind);
    const wrong = [...new Set([...shuffle(same), ...shuffle(other)].map((r) => r.meaning))].filter((m) => m !== item.meaning).slice(0, 3);
    const options = shuffle([item.meaning, ...wrong]);
    const fig = sign(item, { reveal: false });
    const fb = h("p.feedback", { "aria-live": "polite" });
    const shownAt = performance.now();
    panel.append(h("div.task-prompt", h("span.task-label", isStation ? "Which station is this?" : item.kind === "sentence" ? "What does this sentence say?" : "What does this say?")), fb);
    const opts = h("div.qopts", { class: "latin" }, options.map((o) => h("button.qopt", { type: "button", onclick: (e) => choose(o, e.currentTarget) }, o)));
    cellWrap.append(h("div.task-card.read-task", fig, opts));
    function choose(o, el) {
      if (opts.dataset.answered) return;
      opts.dataset.answered = "1";
      const ok = o === item.meaning;
      opts.querySelectorAll("button").forEach((b) => { b.disabled = true; if (b.textContent === item.meaning) b.classList.add("right"); else if (b === el) b.classList.add("wrong"); });
      fig.querySelector(".sign-romaji").hidden = false;
      ok ? NH.Audio.accept(style, 3, 5) : NH.Audio.reject(style);
      fb.className = ok ? "feedback ok" : "feedback no";
      fb.textContent = `${item.kana.replace(/\s/g, "")} is ${item.romaji}: ${item.meaning}`;
      UI.announce(fb.textContent);
      UI.say(item.kana.replace(/\s/g, ""), { quiet: true });
      finish(NH.SRS.gradeChoice(ok, performance.now() - shownAt), done);
    }
  };

  NH.Read = { units, unitReading, sign, byId, itemsOf };
})();

/* js/speak.js */
/* Pronunciation check: say a word, phrase or sign and see what the speech
 * recogniser heard.
 * Web: the browser's Web Speech recognition (Chrome, Edge, Safari). The
 * browser's provider does the listening (Chrome sends the audio to Google),
 * so the first use asks before turning the microphone on.
 * Android app: Android's speech service (@capacitor-community/speech-recognition).
 * Single kana aren't offered: cloud recognisers turn one syllable into a
 * random word, so they need an on-device model (see ROADMAP). */
window.NH = window.NH || {};

(function () {
  const WebSR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const native = window.Capacitor?.isNativePlatform?.() && window.Capacitor.Plugins?.SpeechRecognition;
  // Framed pages (like the Claude artifact) can't get the microphone.
  let framed = false;
  try { framed = window.self !== window.top; } catch (_) { framed = true; }
  const supported = !!native || (!!WebSR && window.isSecureContext !== false && !framed);

  // ── matching (pure, unit-tested) ─────────────────────────
  const KANJI = /[㐀-鿿豈-﫿々]/;
  // Katakana → hiragana; drop spaces, punctuation, long-vowel marks and digits.
  function normalize(s) {
    return [...(s || "")].map((c) => {
      const n = c.codePointAt(0);
      return n >= 0x30a1 && n <= 0x30f6 ? String.fromCodePoint(n - 0x60) : c;
    }).join("").replace(/[\s。、，．,.!?！？「」『』・ー〜~0-9０-９]/g, "");
  }
  // The way it sounds: particle は/へ at the end of a word are wa/e, を is o.
  function sounds(target) {
    return target.split(/\s+/).map((w) => w.replace(/は$/, "わ").replace(/へ$/, "え").replace(/を/g, "お")).join("");
  }
  function lev(a, b) {
    a = [...a]; b = [...b];
    let row = b.map((_, j) => j + 1);
    row.unshift(0);
    for (let i = 1; i <= a.length; i++) {
      let prev = row[0];
      row[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const tmp = row[j];
        row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = tmp;
      }
    }
    return row[b.length];
  }
  // Recognisers write words in kanji (駅 for えき). Each run of kanji may stand
  // for 1–4 kana; the kana around it must line up exactly.
  function kanjiFits(heard, target) {
    if (!KANJI.test(heard)) return false;
    const kana = [...heard].filter((c) => !KANJI.test(c)).length;
    if (kana < [...target].length / 2) return false; // mostly kanji: too loose to judge
    const re = heard.split(/([㐀-鿿豈-﫿々]+)/).map((part, i) =>
      i % 2 ? `.{${[...part].length},${[...part].length * 4}}` : part.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("");
    return new RegExp(`^${re}$`, "u").test(target);
  }

  /* Compares what was heard (the recogniser's alternatives) with the target
   * kana. Returns { ok, close, heard }: ok when any alternative says it,
   * close when the best one is near. */
  function match(targetKana, alternatives, kanji = "") {
    const raw = normalize(targetKana), sound = normalize(sounds(targetKana));
    const k = normalize(kanji);
    let best = null, bestScore = -1;
    for (const alt of alternatives || []) {
      const hd = normalize(alt);
      if (!hd) continue;
      if (hd === raw || hd === sound || (k && hd === k) || kanjiFits(hd, raw) || kanjiFits(hd, sound)) return { ok: true, close: true, heard: alt };
      const score = 1 - Math.min(lev(hd, raw), lev(hd, sound)) / Math.max([...hd].length, [...raw].length);
      if (score > bestScore) { bestScore = score; best = alt; }
    }
    return { ok: false, close: bestScore >= 0.6, heard: best };
  }

  // ── listening ────────────────────────────────────────────
  // Resolves with the recogniser's alternatives, or rejects with a short reason.
  async function listen() {
    if (native) {
      const p = await native.checkPermissions().catch(() => ({}));
      if (p.speechRecognition !== "granted") {
        const r = await native.requestPermissions();
        if (r.speechRecognition !== "granted") throw new Error("not-allowed");
      }
      const res = await native.start({ language: "ja-JP", maxResults: 5, partialResults: false, popup: false });
      return res.matches || [];
    }
    return new Promise((resolve, reject) => {
      const r = new WebSR();
      r.lang = "ja-JP";
      r.maxAlternatives = 5;
      r.interimResults = false;
      r.continuous = false;
      let done = false;
      r.onresult = (e) => { done = true; resolve([...e.results[0]].map((a) => a.transcript)); };
      r.onerror = (e) => { done = true; reject(new Error(e.error || "error")); };
      r.onend = () => { if (!done) reject(new Error("no-speech")); };
      listen.stop = () => { try { r.stop(); } catch (_) {} };
      r.start();
    });
  }
  const WHY = {
    "not-allowed": "The microphone is blocked. Allow it for this site in your browser's settings, then try again.",
    "service-not-allowed": "This browser won't run speech recognition here.",
    "no-speech": "Didn't catch anything. Tap the microphone and speak after the tone.",
    "audio-capture": "No microphone found.",
    network: "Speech recognition in this browser needs an internet connection.",
  };

  // ── the "Say it" sheet ───────────────────────────────────
  function button(item) {
    if (!supported || !item) return null;
    return NH.UI.btn("Say it", () => open(item), "ghost", "mic");
  }

  function open(item) {
    const { h, btn, iconBtn, say, announce } = NH.UI;
    const text = item.kana.replace(/\s/g, "");
    const bg = h("div.sheet-bg", { onclick: (e) => e.target === bg && close() });
    const opener = document.activeElement;
    const keys = (e) => { if (e.key === "Escape") close(); };
    const close = () => { listen.stop?.(); native?.stop?.().catch(() => {}); bg.remove(); document.removeEventListener("keydown", keys); opener?.focus?.(); };
    document.addEventListener("keydown", keys);
    NH.UI.onLeave(close); // a back gesture closes it too
    const body = h("div.say-body");
    const sheet = h("div.sheet.say-sheet", { role: "dialog", "aria-modal": "true", "aria-label": "Say it", tabindex: "-1" },
      h("div.sheet-head", h("h2", "Say it"), iconBtn("close", "Close", close)),
      h("div.say-target", h("b", item.kana), h("span", item.romaji)),
      body);
    bg.append(sheet);
    document.body.append(bg);
    sheet.focus();
    NH.store.settings.speechOk ? ready() : consent();

    function consent() {
      body.replaceChildren(
        h("p", native
          ? "Kaku will use your phone's speech service to turn what you say into text. Depending on the phone, the audio may be sent to Google for this."
          : "Your browser does the listening: Chrome and Edge send the audio to Google or Microsoft to turn it into text, Safari to Apple."),
        h("p.muted", "Kaku itself doesn't record, keep or send anything."),
        h("div.actions", btn("Use the microphone", () => { NH.store.set("speechOk", true); ready(); }, "primary", "mic"), btn("Not now", close, "ghost")));
    }

    function ready(msg) {
      const status = h("p.say-status", { "aria-live": "polite" }, msg || "Listen first if you like, then tap the microphone and say it.");
      const mic = h("button.say-mic", { type: "button", "aria-label": "Start listening", onclick: start }, NH.UI.icon("mic"));
      body.replaceChildren(mic, status, h("div.actions", btn("Listen", () => say(text), "ghost", "speaker")));
      mic.focus();

      async function start() {
        mic.classList.add("on");
        mic.disabled = true;
        status.className = "say-status";
        status.textContent = "Listening…";
        try {
          const alts = await listen();
          const r = match(item.kana, alts, item.kanji);
          mic.classList.remove("on");
          mic.disabled = false;
          status.className = "say-status " + (r.ok ? "ok" : r.close ? "tip" : "no");
          status.textContent = r.ok ? `Yes! Heard ${r.heard}.` : r.heard ? `${r.close ? "Close. " : ""}Heard ${r.heard}. Listen and try again.` : "Couldn't make that out. Try again.";
          r.ok ? NH.Audio.accept(NH.store.settings.style, 3, 5) : NH.Audio.reject(NH.store.settings.style);
          announce(status.textContent);
        } catch (e) {
          mic.classList.remove("on");
          mic.disabled = false;
          status.className = "say-status no";
          status.textContent = WHY[e.message] || "Speech recognition stopped. Try again.";
          announce(status.textContent);
        }
      }
    }
  }

  NH.Speak = { supported, normalize, sounds, match, button, open };
})();

/* js/kanji-line.js */
/* The kanji line: the first 80 kanji grouped by theme with a stroke-count
 * filter, explain pages (readings, parts, radical), words that mix kanji and
 * kana with a furigana toggle, and a quiz. The writing screen, Today and the
 * hub are shared with the kana lines. */
window.NH = window.NH || {};

(function () {
  const { h, hex, shuffle, store } = NH;
  const UI = NH.UI;
  const KANJI = NH.KANJI || [];
  NH.KANJI_INFO = Object.fromEntries(KANJI.map((x) => [x.k, x]));
  const GROUPS = [
    ["numbers", "数", "Numbers"], ["time", "時", "Days and time"], ["people", "人", "People"], ["places", "方", "Places and directions"],
    ["nature", "自然", "Nature"], ["qualities", "形", "Size and colour"], ["things", "物", "Things"], ["actions", "動", "Actions"],
  ];
  const IS_KANJI = /[㐀-鿿々]/;

  // ── furigana ─────────────────────────────────────────────
  /* Puts the reading over each run of kanji: 食べる + たべる → 食(た)べる.
   * The kana around the kanji must match the reading; if not, the whole word
   * gets one reading. Returns nodes for h(). */
  function ruby(text, kana) {
    const runs = text.match(/[㐀-鿿々]+|[^㐀-鿿々]+/g) || [];
    const re = new RegExp(`^${runs.map((r) => (IS_KANJI.test(r) ? "(.+?)" : r.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))).join("")}$`, "u");
    const m = kana.match(re);
    if (!m) return [h("ruby", text, h("rt", kana))];
    let g = 1;
    return runs.map((r) => (IS_KANJI.test(r) ? h("ruby", r, h("rt", m[g++])) : r));
  }
  const furiganaOn = () => store.settings.furigana !== false;
  const applyFurigana = () => (document.documentElement.dataset.furigana = furiganaOn() ? "on" : "off");
  if (typeof document !== "undefined") applyFurigana();
  function furiganaToggle() {
    return h("div.chips.furigana-toggle", { role: "radiogroup", "aria-label": "Furigana (readings over kanji)" },
      h("span.muted", "Furigana:"),
      [[true, "On"], [false, "Off"]].map(([v, label]) => h("button.chip", { type: "button", role: "radio", "aria-checked": String(furiganaOn() === v), onclick: (e) => {
        store.set("furigana", v);
        if (typeof document !== "undefined") applyFurigana();
        e.currentTarget.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-checked", String(b === e.currentTarget)));
      } }, label)));
  }
  Object.assign(NH.UI, { ruby, furiganaToggle });

  const kunText = (k) => (k.includes(".") ? k.replace(".", "(") + ")" : k);
  const partName = (el) => NH.COMPONENT_NAMES?.[el] || "";

  // ── chart ────────────────────────────────────────────────
  function chart(body) {
    const counts = [...new Set(KANJI.map((x) => x.strokes))].sort((a, b) => a - b);
    let count = 0;
    const chips = h("div.chips", { role: "group", "aria-label": "Filter by stroke count" });
    const out = h("div");
    const label = { new: "not started", learning: "learning", due: "due now", strong: "strong" };
    const draw = () => {
      chips.replaceChildren(
        h("button.chip", { type: "button", "aria-pressed": String(!count), onclick: () => { count = 0; draw(); } }, "All"),
        ...counts.map((n) => h("button.chip", { type: "button", "aria-pressed": String(count === n), "aria-label": `${n} stroke${n === 1 ? "" : "s"}`, onclick: () => { count = n; draw(); } }, String(n))));
      out.replaceChildren(...GROUPS.map(([g, jp, en]) => {
        const items = KANJI.filter((x) => x.group === g && (!count || x.strokes === count));
        if (!items.length) return null;
        return h("section.ksec",
          h("div.ksec-head", h("h2", en, h("span.jp", jp))),
          h("div.jgrid", items.map((x) => {
            const st = NH.SRS.strength("j:" + x.k);
            return h("a.jcell", { href: `#k-${hex(x.k)}`, class: "s-" + st },
              h("span.jc", x.k), h("span.jm", x.meaning.split(",")[0]), h("span.jn", { "aria-hidden": "true" }, String(x.strokes)),
              h("span.vh", `, ${x.strokes} stroke${x.strokes === 1 ? "" : "s"}, ${label[st]}`));
          })));
      }));
    };
    draw();
    body.append(
      h("p.intro", "The 80 kanji of JLPT N5, grouped by theme. Filter by stroke count to find one you've seen; on each kanji's page its parts get their own colour."),
      h("div.stroke-filter", h("span.muted", "Strokes:"), chips),
      out);
  }

  // ── explain ──────────────────────────────────────────────
  function explain(ch) {
    const app = document.getElementById("app");
    document.body.classList.add("scr-explain");
    const x = NH.KANJI_INFO[ch];
    const order = KANJI.map((y) => y.k);
    const i = order.indexOf(ch);
    const prev = order[i - 1], next = order[i + 1];
    const svg = UI.strokeOrderSvg(ch);
    const parts = NH.PARTS?.[ch] || [];
    const words = (NH.KANJI_WORDS || []).filter((w) => w.text.includes(ch));
    const examples = [...x.examples];
    for (const w of words) if (examples.length < 5 && !examples.some((e) => e.w === w.text)) examples.push({ w: w.text, r: w.kana, m: w.meaning });
    app.replaceChildren(
      h("header.bar",
        UI.iconBtn("back", "All kanji", () => UI.go("kanji")),
        h("h1.bar-title", h("b", ch), h("small", x.meaning)),
        UI.iconBtn("gear", "Settings", () => UI.settings())),
      h("nav.modes", { "aria-label": "Mode" }, h("a.mode.on", { href: `#k-${hex(ch)}`, "aria-current": "page" }, UI.icon("book"), "Explain"), h("a.mode", { href: `#w-${hex(ch)}` }, UI.icon("pen"), "Write")),
      h("main.explain",
        h("section.hero-card",
          h("div.so-wrap", svg, h("div.so-tools", UI.iconBtn("play", "Replay stroke order", () => UI.replay(svg))),
            h("ol.vh", { "aria-label": `How to write ${ch}` }, NH.Geo.strokesOf(ch).map((st, n) => h("li", `Stroke ${n + 1} ${NH.Geo.describe(st)}.`)))),
          h("div.hero-meta",
            h("div.big-meaning", x.meaning),
            h("div.meta-row", h("span", `${x.strokes} stroke${x.strokes === 1 ? "" : "s"}`), h("span.tag", `radical ${x.radical}`)),
            h("dl.readings",
              x.on.length ? [h("dt", "On"), h("dd", x.on.join("・"))] : null,
              x.kun.length ? [h("dt", "Kun"), h("dd", x.kun.map(kunText).join("・"))] : null),
            parts.length ? h("div.parts", { "aria-label": "Parts" },
              h("span.part-k", ch), h("span.op", "="),
              parts.map((p, n) => [n ? h("span.op", "+") : null, h("span.part", { class: `p${n % 4}` }, h("b", p.el), partName(p.el) ? h("small", partName(p.el)) : null)])) : null)),
        h("section.card.mnemonic", h("h2", "Remember it"), h("p", x.mnemonic)),
        x.notes?.length ? h("section.card", h("h2", "Good to know"), h("ul.notes", x.notes.map((n) => h("li", n)))) : null,
        x.lookalikes?.length ? h("section.card", h("h2", "Don't mix it up with"), h("div.looks", x.lookalikes.map((c) =>
          h("a.look", { href: `#k-${hex(c)}` }, h("span.kc", c), h("span.kr", NH.KANJI_INFO[c]?.meaning.split(",")[0] || ""))))) : null,
        h("section.card",
          h("div.card-head", h("h2", "In words"), furiganaToggle()),
          h("ul.examples", examples.map((e) => {
            const known = (NH.KANJI_WORDS || []).find((w) => w.text === e.w);
            return h("li",
              h("a.ex-w", { href: known ? `#word-${known.id}` : `#p-${hex(e.w)}`, title: "Practice writing this word" }, ruby(e.w, e.r)),
              h("span.ex-r", e.r), h("span.ex-m", e.m), UI.speakBtn(e.r, "small"));
          }))),
        h("div.cta-row", UI.btn("Practice writing", () => UI.go(`w-${hex(ch)}`), "primary", "pen")),
        h("nav.pager",
          prev ? h("a.pg", { href: `#k-${hex(prev)}` }, UI.icon("prev"), h("span", prev)) : h("span"),
          next ? h("a.pg", { href: `#k-${hex(next)}` }, h("span", next), UI.icon("next")) : h("span"))));
    requestAnimationFrame(() => UI.replay(svg));
  }

  // ── words ────────────────────────────────────────────────
  function wordsTab(body) {
    const levels = [[0, "All"], [1, "初級 Beginner"], [2, "中級 Intermediate"], [3, "上級 Advanced"]];
    let level = 0;
    const out = h("div.wlist");
    const chips = h("div.chips", { role: "group", "aria-label": "Difficulty" });
    const draw = () => {
      chips.replaceChildren(...levels.map(([lv, label]) =>
        h("button.chip", { type: "button", "aria-pressed": String(level === lv), onclick: () => { level = lv; draw(); } }, label)));
      out.replaceChildren(...(NH.KANJI_WORDS || []).filter((w) => !level || w.level === level).map((w) => {
        const sc = w.scene?.[0] && NH.Backdrop.art(w.scene[0], "wicon");
        return h("article.wcard",
          h("a.wcard-main", { href: `#word-${w.id}` },
            sc ? h("span.wicon-wrap", sc) : null,
            h("span.wk", { class: [...w.text].length > 5 ? "long" : "" }, ruby(w.text, w.kana)),
            h("span.wm", h("b", w.meaning), h("span", w.romaji)),
            h("span.wlv", { title: `Level ${w.level}` }, "●".repeat(w.level) + "○".repeat(3 - w.level))),
          UI.speakBtn(w.kana, "small"));
      }));
    };
    draw();
    body.append(h("p.intro", "Words that mix kanji with kana, the way they're written in Japan. Write each one character by character; turn furigana off once you can read them."),
      h("div.word-tools", chips, furiganaToggle()), out);
  }

  // ── quiz ─────────────────────────────────────────────────
  const QTYPES = [["j2m", "Kanji → meaning"], ["m2j", "Meaning → kanji"], ["w2r", "Word → reading"], ["w2m", "Word → meaning"]];
  function quiz(body) {
    const groups = Object.fromEntries(GROUPS.map(([g], i) => [g, i < 2]));
    const types = { j2m: true, m2j: true, w2r: false, w2m: false };
    let len = 10;
    const toggle = (obj, k, label) => h("button.chip", { type: "button", "aria-pressed": String(!!obj[k]), onclick: (e) => { obj[k] = !obj[k]; e.currentTarget.setAttribute("aria-pressed", String(obj[k])); } }, label);
    const lens = h("div.chips", [10, 20].map((n) => h("button.chip", { type: "button", "aria-pressed": String(n === len), onclick: (e) => { len = n; lens.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === e.currentTarget))); } }, `${n} questions`)));
    body.append(h("section.card.quiz-setup",
      h("h2", "Kanji to quiz"), h("div.chips", GROUPS.map(([g, , en]) => toggle(groups, g, en))),
      h("h2", "Question types"), h("div.chips", QTYPES.map(([k, l]) => toggle(types, k, l))),
      h("h2", "Length"), lens,
      UI.btn("Start quiz", () => {
        const pool = KANJI.filter((x) => groups[x.group]);
        const ts = Object.keys(types).filter((k) => types[k]);
        const words = (NH.KANJI_WORDS || []).filter((w) => [...w.text].some((c) => pool.some((x) => x.k === c)));
        if (!ts.length) return UI.toast("Pick at least one question type.");
        if (pool.length < 4) return UI.toast("Pick a bigger set of kanji.");
        run(body, pool, words.length >= 4 ? words : NH.KANJI_WORDS, ts, len);
      }, "primary", "play")));
  }

  function run(body, pool, words, types, len) {
    const qs = [];
    for (let i = 0; i < len; i++) {
      const t = types[(Math.random() * types.length) | 0];
      if (t === "j2m" || t === "m2j") {
        const x = pool[(Math.random() * pool.length) | 0];
        const others = shuffle([...pool.filter((y) => y !== x && x.lookalikes.includes(y.k)), ...shuffle(pool.filter((y) => y !== x))]);
        const wrong = [...new Set(others)].slice(0, 3);
        qs.push(t === "j2m"
          ? { id: "j:" + x.k, ask: "What does this kanji mean?", prompt: x.k, answer: x.meaning, options: shuffle([x, ...wrong].map((y) => y.meaning)), latin: true, say: x.examples[0]?.r }
          : { id: "j:" + x.k, ask: "Which kanji means this?", prompt: x.meaning, promptLatin: true, answer: x.k, options: shuffle([x, ...wrong].map((y) => y.k)), say: x.examples[0]?.r });
      } else {
        const w = words[(Math.random() * words.length) | 0];
        const key = t === "w2r" ? "kana" : "meaning";
        const wrong = shuffle(NH.KANJI_WORDS.filter((y) => y !== w && y[key] !== w[key])).slice(0, 3);
        qs.push({ id: "v:" + w.id, ask: t === "w2r" ? "How is this word read?" : "What does this word mean?", prompt: w.text, answer: w[key], options: shuffle([w, ...wrong].map((y) => y[key])), latin: t === "w2m", say: w.kana });
      }
    }
    let i = 0, right = 0;
    const wrap = h("section.quiz");
    body.replaceChildren(wrap);
    const show = () => {
      if (i >= qs.length) return summary();
      const q = qs[i];
      let answered = false;
      const shownAt = performance.now();
      const opts = h("div.qopts", { class: q.latin ? "latin" : "kana" }, q.options.map((o) => h("button.qopt", { type: "button", onclick: (e) => choose(o, e.currentTarget) }, o)));
      wrap.replaceChildren(
        h("div.qhead", h("span", `${i + 1} / ${qs.length}`), h("div.qbar", h("i", { style: { width: `${(i / qs.length) * 100}%` } })), h("span", `${right} ✓`)),
        h("p.qask", q.ask), h("div.qprompt", { class: q.promptLatin ? "latin" : [...q.prompt].length > 1 ? "word" : "" }, q.prompt), opts, h("div.qfoot"));
      function choose(o, el) {
        if (answered) return;
        answered = true;
        const ok = o === q.answer;
        NH.SRS.practice(q.id, NH.SRS.gradeChoice(ok, performance.now() - shownAt));
        ok ? NH.Audio.accept(store.settings.style, 3, 5) : NH.Audio.reject(store.settings.style);
        opts.querySelectorAll("button").forEach((b) => { if (b.textContent === q.answer) b.classList.add("right"); else if (b === el) b.classList.add("wrong"); b.disabled = true; });
        if (ok) right++;
        UI.announce(ok ? `Correct: ${q.answer}.` : `Not quite. The answer is ${q.answer}.`);
        if (q.say) UI.say(q.say, { quiet: true });
        if (ok) setTimeout(() => { i++; show(); }, 900);
        else wrap.querySelector(".qfoot").append(h("p", h("b", q.prompt), ` → ${q.answer}`), UI.btn("Next", () => { i++; show(); }, "primary", "next"));
      }
    };
    const summary = () => {
      NH.Audio.complete(store.settings.style, (right / qs.length) * 100);
      wrap.replaceChildren(h("div.qsum",
        h("div.result-score", h("b", String(right)), h("span", ` / ${qs.length}`)),
        h("p", right === qs.length ? "Every one right." : `${qs.length - right} to review.`),
        h("div.result-actions", UI.btn("New quiz", () => { body.replaceChildren(); quiz(body); }, "primary", "redo"))));
    };
    show();
  }

  NH.SCRIPTS.kanji = {
    id: "kanji", jp: "漢字", en: "Kanji", code: "J", line: "var(--line-j)", order: KANJI.map((x) => x.k),
    screens: { symbols: chart, words: wordsTab, quiz },
  };
  NH.Kanji = { explain, ruby, GROUPS };
})();

/* js/app.js */
/* Screens and routing. Routes live in the hash (#hiragana, #k-3042, #w-3042,
 * #word-mizu …) so Android's back button and bookmarks work. */
window.NH = window.NH || {};

(function () {
  const { h, s, store, Audio, TTS, Backdrop, hex, unhex, shuffle } = NH;
  const app = document.getElementById("app");
  let cleanup = [];

  // ── icons (inline vector) ────────────────────────────────
  const ICONS = {
    back: "M15 5 8 12l7 7",
    speaker: "M4 9v6h4l5 4V5L8 9H4Zm12.5-1.5a5 5 0 0 1 0 9M19 5a8.5 8.5 0 0 1 0 14",
    gear: "M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8 3.5-2.1-.6-.5-1.3 1-1.9-1.6-1.6-1.9 1-1.3-.5L13 4h-2l-.6 2.1-1.3.5-1.9-1L5.6 7.2l1 1.9-.5 1.3L4 11v2l2.1.6.5 1.3-1 1.9 1.6 1.6 1.9-1 1.3.5L11 20h2l.6-2.1 1.3-.5 1.9 1 1.6-1.6-1-1.9.5-1.3L20 13Z",
    play: "M8 5v14l11-7Z",
    redo: "M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4",
    next: "M9 5l7 7-7 7",
    prev: "M15 5l-7 7 7 7",
    pen: "M4 20l4-1 11-11-3-3L5 16l-1 4Zm10-13 3 3",
    book: "M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Zm0 14a2 2 0 0 1 2-2h13",
    close: "M6 6l12 12M18 6 6 18",
    mic: "M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-7 9a7 7 0 0 0 14 0M12 19v3",
    ear: "M7 10a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-5 2M10 10a2 2 0 0 1 4 0",
    sun: "M12 4V2m0 20v-2m8-8h2M2 12h2m13.7-5.7 1.4-1.4M4.9 19.1l1.4-1.4m11.4 0 1.4 1.4M4.9 4.9l1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z",
  };
  const icon = (name) => s("svg.ic", { viewBox: "0 0 24 24", "aria-hidden": "true" }, s("path", { d: ICONS[name] }));

  const btn = (label, onclick, cls = "", ic) =>
    h("button", { type: "button", class: "btn " + cls, onclick: (e) => { Audio.tap(); onclick(e); } }, ic ? icon(ic) : null, label ? h("span", label) : null);
  const iconBtn = (name, label, onclick, cls = "") =>
    h("button", { type: "button", class: "icon-btn " + cls, "aria-label": label, title: label, onclick: (e) => { Audio.tap(); onclick(e); } }, icon(name));
  const speakBtn = (text, cls = "") => iconBtn("speaker", `Listen: ${text}`, () => say(text), cls);

  let warnedVoice = false;
  function say(text, { quiet = false } = {}) {
    if ((!TTS.supported || !TTS.hasJapanese) && !warnedVoice && !quiet && (warnedVoice = true)) toast(TTS.supported ? "No Japanese voice installed. See Settings → Voice." : "This browser can't speak. Try Chrome or Safari.");
    TTS.speak(text);
  }

  function toast(msg) {
    const t = h("div.toast", { role: "status" }, msg);
    document.body.append(t);
    setTimeout(() => t.classList.add("out"), 2600);
    setTimeout(() => t.remove(), 3100);
  }

  // Hub tab routes: hiragana keeps the short ones (#today, #words…); katakana's are #katakana-words…
  const tabRoute = (tab, S = NH.SCRIPTS.hiragana) =>
    S.id === "hiragana" ? (tab === "symbols" ? "hiragana" : tab) : tab === "symbols" ? S.id : `${S.id}-${tab}`;
  const go = (route) => { if (location.hash.slice(1) === route) render(); else location.hash = route; };
  const info = (ch) => (NH.KANA_INFO && NH.KANA_INFO[ch]) || {};
  // A kanji has no single romaji, so labels show its meaning instead.
  const romaji = (ch) => (NH.KANJI_INFO?.[ch] ? NH.KANJI_INFO[ch].meaning : NH.romajiOf(ch));

  // Shared with the screens in today.js, read.js and speak.js.
  Object.assign(NH.UI, { h, s, icon, btn, iconBtn, speakBtn, say, toast, go, tabRoute, romaji, info, onLeave: (fn) => cleanup.push(fn),
    strokeOrderSvg: (ch) => strokeOrderSvg(ch), replay: (svg) => replay(svg), announce: (m) => announce(m), settings: () => settings(), syncBars: () => syncBars() });

  // ── router ───────────────────────────────────────────────
  function render() {
    cleanup.forEach((fn) => fn());
    cleanup = [];
    document.body.className = "";
    const r = location.hash.slice(1) || "home";
    let m;
    window.scrollTo(0, 0);
    if (r === "home") return home();
    if (r === "hiragana" || r === "symbols") return hub("symbols");
    if (r === "katakana" || r === "kanji") return hub("symbols", r);
    if ((m = r.match(/^(katakana|kanji)-(today|words|read|quiz)$/))) return hub(m[2], m[1]);
    if (r === "words" || r === "phrases" || r === "quiz" || NH.Tabs[r]) return hub(r);
    if ((m = r.match(/^k-([0-9a-f-]+)$/))) return NH.KANJI_INFO?.[unhex(m[1])] ? NH.Kanji.explain(unhex(m[1])) : explain(unhex(m[1]));
    if ((m = r.match(/^w-([0-9a-f-]+)$/))) return writeScreen({ chars: [...unhex(m[1])], key: unhex(m[1]), back: `k-${m[1]}` });
    if ((m = r.match(/^(word|phrase)-([a-z0-9-]+)$/))) {
      const list = m[1] === "word" ? [...NH.WORDS, ...(NH.KANJI_WORDS || [])] : NH.PHRASES;
      const item = list.find((x) => x.id === m[2]);
      // Kanji words are written as `text` (日本) and read as `kana` (にほん).

      if (item) return writeScreen({ chars: [...text], item, key: text, back: tabRoute(m[1] === "word" ? "words" : "phrases", NH.scriptOf(text)) });

    for (const route of NH.Routes) if ((m = r.match(route.match))) return route.render(m);

  // ── explain ──────────────────────────────────────────────

              h("li", `${[...ch].length > 1 ? c + ", " : ""}stroke ${i + 1} ${NH.Geo.describe(st)}.`))))),
          h("div.hero-meta",
            h("div.big-romaji", romaji(ch)),

            parts && parts[1] !== "small" ? h("div.equation", parts.map((p, i) => [i ? h("span.op", "+") : null, h("a.eq", { href: p.length === 1 && NH.STROKES[p] ? `#k-${hex(p)}` : null }, p)]), h("span.op", "="), h("b.eq", ch)) : null,
            I.origin ? h("div.origin", h("span.origin-k", I.origin), h("span.origin-arrow", "→"), h("span.origin-h", ch), S.id === "katakana"
              ? h("p", "Taken from the kanji ", h("b", I.origin), I.originMeaning ? ` (“${I.originMeaning}”)` : "", I.originPart ? `: ${I.originPart}` : "", ". Katakana were made from pieces of kanji, so they're straight and angular.")
              : h("p", "Grew from the kanji ", h("b", I.origin), I.originMeaning ? ` (“${I.originMeaning}”)` : "", ", written fast in cursive until it became ", ch, ".")) : null,
            twin !== ch && NH.KANA_INFO[twin] ? h("a.twin", { href: `#k-${hex(twin)}` }, h("span", S.id === "katakana" ? "Hiragana twin" : "Katakana twin"), h("b", twin), h("span", romaji(twin))) : null)),
        I.mnemonic ? h("section.card.mnemonic", h("h2", "Remember it"), h("p", I.mnemonic)) : null,
        notes.length ? h("section.card", h("h2", "Good to know"), h("ul.notes", notes.map((n) => h("li", n)))) : null,
        I.lookalikes && I.lookalikes.length ? h("section.card", h("h2", "Don't mix it up with"), h("div.looks", I.lookalikes.map((c) => h("a.look", { href: NH.KANA_INFO[c] ? `#k-${hex(c)}` : null }, h("span.kc", c), h("span.kr", romaji(c)))))) : null,
        examplesCard(ch, I),
